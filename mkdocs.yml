site_name: Lens
site_url: https://adeelahmad.github.io/lense/
site_description: "Lens: intelligence for your agent. Safe, secure and cost-effective. Turns your live data streams into a cited knowledge graph your agent can reason over."

repo_name: adeelahmad/lense
repo_url: https://github.com/adeelahmad/lense/
edit_uri: blob/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Start:
      - Get started: get-started.md
      - Deployment: deployment.md
      - microsandbox: microsandbox.md
      - Configuration: configuration.md
      - Components: components.md
      - Updates and backups: updates.md
      - Remote access: remote-access.md
  - Agents and apps:
      - MCP server: mcp.md
      - API: api.md
      - Authentication: authentication.md
      - Access: access.md
  - Use:
      - Chat and batch runs: assistant.md
      - Chat rooms: chat-rooms.md
      - Podcasts: podcasts.md
      - Notes: notes.md
      - Web clipper: web-clipper.md
      - Sensors: sensors.md
      - Processing: processing.md
      - Video: video.md
      - Notifications: notifications.md
  - Knowledge:
      - Graph and Cypher: graph.md
      - Graph history: graph-history.md
      - Topics: topics.md
      - The graph as files: file-tree.md
      - Linked data (RDF): rdf.md
      - IIIF: iiif.md
      - Fedora repository: fedora.md
  - Models and cost:
      - Local models: local-models.md
      - Speech providers: speech-providers.md
      - Activity and costs: activity.md
      - Budgets: budgets.md
  - Operate:
      - Encryption: encryption.md
      - Storage: storage.md
      - Database: database.md
      - Telemetry: telemetry.md
      - Prometheus: prometheus.md
  - Build:
      - Architecture: architecture.md
      - Web app: frontend.md
      - Technology: technology-selection.md
      - API work the design needs: backend-gaps.md
      - Contributing: contributing.md
  - Changelog: CHANGELOG.md

plugins:
  - search

hooks:
  - overrides/hooks.py

exclude_docs: |
  brand/README.md
  project.json

extra_css:
  - stylesheets/extra.css
