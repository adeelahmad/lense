site_name: Lens
site_description: An archive for recorded speech and video, on FastAPI, Next.js and SurrealDB.

repo_name: adeelahmad/lense
repo_url: https://github.com/adeelahmad/lense/
edit_uri: blob/main/docs/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Get started: get-started.md
  - Architecture: architecture.md
  - Web app: frontend.md
  - Authentication: authentication.md
  - Access: access.md
  - Database: database.md
  - Configuration: configuration.md
  - Processing: processing.md
  - Components: components.md
  - Video: video.md
  - Chat and batch runs: assistant.md
  - Notifications: notifications.md
  - Chat rooms: chat-rooms.md
  - Sensors: sensors.md
  - Telemetry: telemetry.md
  - IIIF: iiif.md
  - Graph and Cypher: graph.md
  - Notes: notes.md
  - Linked data (RDF): rdf.md
  - Fedora repository: fedora.md
  - API: api.md
  - MCP server: mcp.md
  - API work the design needs: backend-gaps.md
  - Encryption: encryption.md
  - Remote access: remote-access.md
  - Deployment: deployment.md
  - Technology: technology-selection.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css
