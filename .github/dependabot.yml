# Weekly dependency updates. Titles are Conventional Commits (`build(deps): bump …`), which the changelog lists
# under Dependencies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /fastapi_backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm
    directory: /nextjs-frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      javascript-minor:
        update-types: [minor, patch]
    ignore:
      # BlockSuite after 0.19 is published as raw TypeScript (exports point at src/*.ts) and drops the editor
      # presets, so it only builds inside AFFiNE's own repo. The notes editor stays on 0.19.5 until that changes.
      - dependency-name: "@blocksuite/*"

  - package-ecosystem: npm # pnpm: Nx, the root's only dependency
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directories: [/fastapi_backend, /nextjs-frontend]
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The images run what CI tests: Node 22 (an LTS line) and Python 3.12 (pyproject's requires-python is
      # >=3.12,<3.14). Moving either is its own change, made in CI, pyproject and the images together, so Dependabot
      # leaves the Node major and the Python minor alone. Odd Node majors are never LTS, and Node 25 has no corepack.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
