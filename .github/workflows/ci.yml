name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: FastAPI (embedded SurrealDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: System packages (ffmpeg, tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check app/api app/core app/schemas tests

      - name: Type check
        run: uv run mypy

      - name: OpenAPI schema is up to date
        run: |
          OPENAPI_OUTPUT_FILE=/tmp/openapi.json uv run python -m commands.generate_openapi_schema
          diff -u ../nextjs-frontend/openapi.json /tmp/openapi.json

      - name: Tests
        run: uv run coverage run -m pytest -n auto

      - name: Coverage report
        run: uv run coverage xml -o coverage.xml

      - uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: python-coverage
          parallel: true
          file: fastapi_backend/coverage.xml

  backend-surrealdb-server:
    name: FastAPI (SurrealDB server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
      LENS_TEST_SURREAL_URL: ws://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Start SurrealDB
        run: |
          # surrealkv, not memory: the memory engine loses concurrent writes (SurrealDB 3.2.4)
          docker run -d --name surreal -p 8000:8000 surrealdb/surrealdb:v3.2.4 start --user root --pass root surrealkv:/tmp/lens.db
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: System packages (ffmpeg, tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests against the server
        run: uv run pytest -n 4

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nextjs-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: nextjs-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm coverage
      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: http://localhost:8000
          AUTH_SECRET: ci-auth-secret
      - uses: coverallsapp/github-action@v2.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: node-coverage
          parallel: true

  finish:
    name: Coveralls
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2.3.4
        with:
          parallel-finished: true
          carryforward: "python-coverage,node-coverage"
