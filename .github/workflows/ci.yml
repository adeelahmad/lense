name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushes to a pull request cancel its older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI (embedded SurrealDB)
    # the Linux runner: apt packages (LibreOffice included), as on GitHub's runners
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      # GitHub's cache only on GitHub's runners; a self-hosted one keeps ~/apt-archives on its disk
      - name: Restore system packages
        if: runner.environment == 'github-hosted'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        if: runner.os == 'Linux'
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          # a self-hosted runner that has them already needs no sudo
          have=yes; for t in ffmpeg tesseract pdftoppm soffice; do command -v "$t" >/dev/null || have=""; done
          if [ -n "$have" ]; then echo "already installed"; exit 0; fi
          mkdir -p ~/apt-archives/partial
          APT=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o "Dir::Cache::Archives=$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get "${APT[@]}" update
          sudo apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: runner.environment == 'github-hosted' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: System packages on macOS (ffmpeg, tesseract, poppler; LibreOffice tests skip without it)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for p in ffmpeg tesseract poppler; do brew list "$p" >/dev/null 2>&1 || brew install "$p"; done

      - uses: astral-sh/setup-uv@v7
        with:
          # a cache that outlives the job on the self-hosted runner (the default is in the job's temp folder)
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: OpenAPI schema is up to date
        run: |
          OPENAPI_OUTPUT_FILE=/tmp/openapi.json uv run python -m commands.generate_openapi_schema
          diff -u ../nextjs-frontend/openapi.json /tmp/openapi.json

      - name: Tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          uv run pytest -n auto -p no:cacheprovider --cov=app --cov-report=xml:coverage.xml --cov-report=term | tee pytest.txt
          { echo "### Backend coverage"; echo '```'; grep -E '^(Name|TOTAL)' pytest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: fastapi_backend/coverage.xml

  backend-surrealdb-server:
    name: FastAPI (SurrealDB server)
    # the Linux runner: Docker for SurrealDB, apt packages
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
      # a self-hosted runner's Docker outlives the job: a name of its own and any free port, removed at the end
      SURREAL_CONTAINER: lens-ci-surreal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SurrealDB
        run: |
          # surrealkv, not memory: the memory engine loses concurrent writes (SurrealDB 3.2.4)
          docker run -d --name "$SURREAL_CONTAINER" -p 127.0.0.1::8000 surrealdb/surrealdb:v3.2.4 start --user root --pass root surrealkv:/tmp/lens.db
          port=$(docker port "$SURREAL_CONTAINER" 8000/tcp | head -n1 | sed 's/.*://')
          echo "LENS_TEST_SURREAL_URL=ws://127.0.0.1:$port" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/health" && break; sleep 1; done
      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      # GitHub's cache only on GitHub's runners; a self-hosted one keeps ~/apt-archives on its disk
      - name: Restore system packages
        if: runner.environment == 'github-hosted'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        if: runner.os == 'Linux'
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          # a self-hosted runner that has them already needs no sudo
          have=yes; for t in ffmpeg tesseract pdftoppm soffice; do command -v "$t" >/dev/null || have=""; done
          if [ -n "$have" ]; then echo "already installed"; exit 0; fi
          mkdir -p ~/apt-archives/partial
          APT=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o "Dir::Cache::Archives=$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get "${APT[@]}" update
          sudo apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: runner.environment == 'github-hosted' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: System packages on macOS (ffmpeg, tesseract, poppler; LibreOffice tests skip without it)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for p in ffmpeg tesseract poppler; do brew list "$p" >/dev/null 2>&1 || brew install "$p"; done
      - uses: astral-sh/setup-uv@v7
        with:
          # a cache that outlives the job on the self-hosted runner (the default is in the job's temp folder)
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests against the server
        timeout-minutes: 30
        run: uv run pytest -n 4
      - name: Remove SurrealDB
        if: always()
        run: docker rm -f "$SURREAL_CONTAINER" || true

  frontend:
    name: Next.js
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: ./nextjs-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          # the pnpm version comes from packageManager in the frontend's package.json
          package_json_file: nextjs-frontend/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # on the self-hosted runner pnpm's store stays on disk; saving it to GitHub's cache took minutes
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: nextjs-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc
      - name: Tests
        run: |
          set -o pipefail
          pnpm coverage --coverageReporters=text-summary --coverageReporters=lcov | tee coverage.txt
          { echo "### Frontend coverage"; echo '```'; sed -n '/Coverage summary/,/^=*$/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: nextjs-frontend/coverage/lcov.info
      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: http://localhost:8000
          AUTH_SECRET: ci-auth-secret
