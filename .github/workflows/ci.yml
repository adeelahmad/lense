name: CI

on:
  push:
    branches: [main]
  pull_request:
  # by hand: every project, not only the affected ones
  workflow_dispatch:

# Pushes to a pull request cancel its older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # to find main's last green run, the base a push to main is compared with

# Nx (nx.json, and each project's project.json) runs the checks. The first job asks it which projects the change
# affects; each job below runs only when its project is one of them, and a job that doesn't run counts as passed.
# A pull request is compared with the main it merges into, a push to main with main's last green CI run.
#
# Each task runs fresh here: Nx's cache is for a contributor's machine, and CI neither reads nor fills one.
env:
  NX_SKIP_NX_CACHE: "true"

# Every workflow runs on GitHub's ubuntu-latest. To use a self-hosted runner instead, set the repository variable
# CI_RUNNER (Settings → Secrets and variables → Actions → Variables) to its labels as JSON: ["self-hosted","Linux","X64"]
jobs:
  affected:
    name: Affected projects
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      others: ${{ steps.affected.outputs.others }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history back to the base the change is compared with
          filter: tree:0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Nx
        run: pnpm install --frozen-lockfile
      - name: The commits to compare
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@v5
      - name: The projects the change affects
        id: affected
        run: |
          # anything but two JSON lists fails this job, and then every job runs
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            projects=$(pnpm exec nx show projects --json | jq -c .)
            others=$(pnpm exec nx show projects --exclude=backend,frontend --json | jq -c .)
          else
            projects=$(pnpm exec nx show projects --affected --json | jq -c .)
            others=$(pnpm exec nx show projects --affected --exclude=backend,frontend --json | jq -c .)
          fi
          jq -en --argjson p "$projects" --argjson o "$others" '($p | type) == "array" and ($o | type) == "array"' >/dev/null
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "others=$others" >> "$GITHUB_OUTPUT"
          {
            echo "### Affected projects"
            if [ -n "${NX_BASE:-}" ]; then echo "Comparing \`${NX_BASE:0:12}\` with \`${NX_HEAD:0:12}\`."; else echo "Run by hand: every project."; fi
            echo
            echo "$projects" | jq -r 'if length == 0 then "None: nothing to build or test." else map("- " + .) | join("\n") end'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: FastAPI (embedded SurrealDB)
    needs: affected
    # when the affected job itself fails, run anyway
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.projects, '"backend"')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      # GitHub's cache only on GitHub's runners; a self-hosted one keeps ~/apt-archives on its disk
      - name: Restore system packages
        if: runner.environment == 'github-hosted'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        if: runner.os == 'Linux'
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          # a self-hosted runner that has them already needs no sudo
          have=yes; for t in ffmpeg tesseract pdftoppm soffice; do command -v "$t" >/dev/null || have=""; done
          if [ -n "$have" ]; then echo "already installed"; exit 0; fi
          mkdir -p ~/apt-archives/partial
          APT=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o "Dir::Cache::Archives=$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get "${APT[@]}" update
          sudo apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: runner.environment == 'github-hosted' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: System packages on macOS (ffmpeg, tesseract, poppler; LibreOffice tests skip without it)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for p in ffmpeg tesseract poppler; do brew list "$p" >/dev/null 2>&1 || brew install "$p"; done

      - uses: astral-sh/setup-uv@v7
        with:
          # a cache that outlives the job on the self-hosted runner (the default is in the job's temp folder)
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Nx
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install
        run: uv sync --frozen

      # the commands are the targets in fastapi_backend/project.json
      - name: Lint
        run: pnpm exec nx run backend:lint

      - name: Type check
        run: pnpm exec nx run backend:typecheck

      - name: OpenAPI schema is up to date
        run: pnpm exec nx run backend:openapi-check

      - name: Tests
        # the suite took 28 min on the self-hosted runner at 544 tests (3 min on a laptop); it keeps growing
        timeout-minutes: 60
        run: |
          set -o pipefail
          pnpm exec nx run backend:test:ci | tee pytest.txt
          { echo "### Backend coverage"; echo '```'; grep -E '^(Name|TOTAL)' pytest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: fastapi_backend/coverage.xml

  backend-surrealdb-server:
    name: FastAPI (SurrealDB server)
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.projects, '"backend"')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
      # a self-hosted runner's Docker outlives the job: a name of its own and any free port, removed at the end
      SURREAL_CONTAINER: lens-ci-surreal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Start SurrealDB
        run: |
          # surrealkv, not memory: the memory engine loses concurrent writes (SurrealDB 3.2.4)
          # on a tmpfs: the data is thrown away, and syncing every write to the runner's disk made each test's schema take seconds
          docker run -d --name "$SURREAL_CONTAINER" --tmpfs /data:mode=1777 -p 127.0.0.1::8000 surrealdb/surrealdb:v3.2.4 start --user root --pass root surrealkv:/data/lens.db
          port=$(docker port "$SURREAL_CONTAINER" 8000/tcp | head -n1 | sed 's/.*://')
          echo "LENS_TEST_SURREAL_URL=ws://127.0.0.1:$port" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/health" && break; sleep 1; done
      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      # GitHub's cache only on GitHub's runners; a self-hosted one keeps ~/apt-archives on its disk
      - name: Restore system packages
        if: runner.environment == 'github-hosted'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        if: runner.os == 'Linux'
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          # a self-hosted runner that has them already needs no sudo
          have=yes; for t in ffmpeg tesseract pdftoppm soffice; do command -v "$t" >/dev/null || have=""; done
          if [ -n "$have" ]; then echo "already installed"; exit 0; fi
          mkdir -p ~/apt-archives/partial
          APT=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o "Dir::Cache::Archives=$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get "${APT[@]}" update
          sudo apt-get "${APT[@]}" install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: runner.environment == 'github-hosted' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: System packages on macOS (ffmpeg, tesseract, poppler; LibreOffice tests skip without it)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: for p in ffmpeg tesseract poppler; do brew list "$p" >/dev/null 2>&1 || brew install "$p"; done
      - uses: astral-sh/setup-uv@v7
        with:
          # a cache that outlives the job on the self-hosted runner (the default is in the job's temp folder)
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Nx
        working-directory: .
        run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Tests against the server
        # slower than the embedded run: 30 min covered two thirds of it on the self-hosted runner
        timeout-minutes: 75
        run: pnpm exec nx run backend:test:server
      - name: Remove SurrealDB
        if: always()
        run: docker rm -f "$SURREAL_CONTAINER" || true

  frontend:
    name: Next.js
    needs: affected
    if: ${{ !cancelled() && (needs.affected.result != 'success' || contains(needs.affected.outputs.projects, '"frontend"')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          # the pnpm version comes from packageManager in package.json (the same in the frontend's)
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # on the self-hosted runner pnpm's store stays on disk; saving it to GitHub's cache took minutes
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: |
            pnpm-lock.yaml
            nextjs-frontend/pnpm-lock.yaml
      - name: Install Nx
        run: pnpm install --frozen-lockfile
      - name: Install
        working-directory: ./nextjs-frontend
        run: pnpm install --frozen-lockfile
      # the commands are the targets in nextjs-frontend/project.json
      - name: Lint
        run: pnpm exec nx run frontend:lint
      - name: Type check
        run: pnpm exec nx run frontend:typecheck
      - name: Tests
        run: |
          set -o pipefail
          pnpm exec nx run frontend:test:ci | tee coverage.txt
          { echo "### Frontend coverage"; echo '```'; sed -n '/Coverage summary/,/^=*$/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: nextjs-frontend/coverage/lcov.info
      - name: Build
        run: pnpm exec nx run frontend:build
        env:
          API_BASE_URL: http://localhost:8000
          AUTH_SECRET: ci-auth-secret

  projects:
    name: Other projects
    needs: affected
    # every other project with lint, typecheck, test or build targets: a new project.json is all it takes to join
    if: ${{ !cancelled() && (needs.affected.result != 'success' || needs.affected.outputs.others != '[]') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    env:
      OTHERS: ${{ needs.affected.outputs.others }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Nx
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"
      - name: Lint, type check, test and build them
        run: |
          # all of them when the affected job didn't say
          if [ -n "$OTHERS" ]; then
            pnpm exec nx run-many -t lint typecheck test build --outputStyle=static -p "$(echo "$OTHERS" | jq -r 'join(",")')"
          else
            pnpm exec nx run-many -t lint typecheck test build --outputStyle=static --exclude=backend,frontend
          fi
