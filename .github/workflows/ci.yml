name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: FastAPI (embedded SurrealDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      - name: Restore system packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          mkdir -p ~/apt-archives/partial
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Chromium prints a page (diagnostic)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          uv run python - <<'PY'
          import pathlib, re, shutil, subprocess, tempfile, time
          from app.domain import convert
          exe = shutil.which("chromium")
          version = subprocess.run([exe, "--version"], capture_output=True, text=True).stdout.strip()
          print("chromium:", exe, version, "| without its sandbox:", convert.no_sandbox(exe), flush=True)
          real = subprocess.run
          at = lambda ln: (m := re.match(r"\[\d+:\d+:\d{4}/(\d\d)(\d\d)(\d\d\.\d+)", ln)) and int(m[1]) * 3600 + int(m[2]) * 60 + float(m[3])

          def chromium(drop=(), verbose=False):
              """Chromium as Lens runs it (less the switches in `drop`), saying where it went quiet for long."""
              def run(argv, **kw):
                  argv = [a for a in argv if not a.startswith(drop)] if drop else list(argv)
                  argv[1:1] = ["--v=1"] if verbose else []
                  kw["timeout"], t = 45, time.time()
                  try:
                      r = real(argv, **kw)
                      err, how = r.stderr, f"exit {r.returncode}"
                  except subprocess.TimeoutExpired as e:
                      err, how = e.stderr, "TIMED OUT"
                  text = err.decode(errors="replace") if isinstance(err, bytes) else err or ""
                  lines = [x for x in text.splitlines() if at(x) is not None]  # its log, not its histograms
                  print(f"== {how} after {time.time() - t:.1f} s; it logged {len(lines)} lines", flush=True)
                  for i in range(1, len(lines)):
                      if at(lines[i]) - at(lines[i - 1]) > 2:
                          print(f"-- quiet for {at(lines[i]) - at(lines[i - 1]):.1f} s, between:", flush=True)
                          for x in lines[max(0, i - 10) : i + 2]:
                              print("   ", x[:300], flush=True)
                  print("-- last:", flush=True)
                  for x in lines[-25:]:
                      print("   ", x[:300], flush=True)
                  if how == "TIMED OUT":
                      raise subprocess.TimeoutExpired(argv, 45)
                  return r
              return run

          page = convert.text_page("High at noon.", "Tide notes")
          for name, drop, verbose in (
              ("as Lens runs it, its log verbose", (), True),
              ("without virtual time", ("--virtual-time-budget", "--run-all-compositor-stages-before-draw"), False),
          ):
              print(f"#### {name}", flush=True)
              convert.subprocess.run = chromium(drop, verbose)
              out = pathlib.Path(tempfile.mkdtemp()) / "page.pdf"
              try:
                  convert.html_pdf({"documents": {"chromium": exe, "convert_seconds": 45}}, page, out)
                  print(f"printed {out.stat().st_size} bytes", flush=True)
              except Exception as e:
                  print("FAILED:", str(e)[:300], flush=True)
              finally:
                  convert.subprocess.run = real
          PY

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: OpenAPI schema is up to date
        run: |
          OPENAPI_OUTPUT_FILE=/tmp/openapi.json uv run python -m commands.generate_openapi_schema
          diff -u ../nextjs-frontend/openapi.json /tmp/openapi.json

      - name: Tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          uv run pytest -n auto -p no:cacheprovider --cov=app --cov-report=xml:coverage.xml --cov-report=term | tee pytest.txt
          { echo "### Backend coverage"; echo '```'; grep -E '^(Name|TOTAL)' pytest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: fastapi_backend/coverage.xml

  backend-surrealdb-server:
    name: FastAPI (SurrealDB server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fastapi_backend
    env:
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
      LENS_TEST_SURREAL_URL: ws://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Start SurrealDB
        run: |
          # surrealkv, not memory: the memory engine loses concurrent writes (SurrealDB 3.2.4)
          docker run -d --name surreal -p 8000:8000 surrealdb/surrealdb:v3.2.4 start --user root --pass root surrealkv:/tmp/lens.db
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      # the packages are kept between runs: the mirror can be slow (LibreOffice is 170 MB)
      - name: Restore system packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages (ffmpeg, tesseract, poppler, LibreOffice Writer)
        timeout-minutes: 25 # a stalled mirror fails the job instead of holding it for hours
        run: |
          mkdir -p ~/apt-archives/partial
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends ffmpeg tesseract-ocr poppler-utils libreoffice-writer-nogui
          sudo chown -R "$(id -u)" ~/apt-archives
      - name: Keep system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests against the server
        timeout-minutes: 30
        run: uv run pytest -n 4

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nextjs-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # the pnpm version comes from packageManager in the frontend's package.json
          package_json_file: nextjs-frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: nextjs-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc
      - name: Tests
        run: |
          set -o pipefail
          pnpm coverage --coverageReporters=text-summary --coverageReporters=lcov | tee coverage.txt
          { echo "### Frontend coverage"; echo '```'; sed -n '/Coverage summary/,/^=*$/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: nextjs-frontend/coverage/lcov.info
      - name: Build
        run: pnpm build
        env:
          API_BASE_URL: http://localhost:8000
          AUTH_SECRET: ci-auth-secret
