name: Browser extension (Firefox)

# The Firefox build of the Lens web clipper (extensions/browser, target firefox): Mozilla's own linter (web-ext lint,
# the checks addons.mozilla.org runs) on dist/firefox, then web-ext build for an upload-ready zip. A release also gets
# it signed by Mozilla (unlisted, so it installs from the release page) as lens-clipper-firefox.xpi when the
# AMO_JWT_ISSUER and AMO_JWT_SECRET secrets hold an addons.mozilla.org API key; the unsigned zip reaches the release
# through the Browser extension workflow either way.
on:
  push:
    branches: [main]
    paths:
      - extensions/browser/**
      - .github/workflows/browser-extension-firefox.yml
  pull_request:
    paths:
      - extensions/browser/**
      - .github/workflows/browser-extension-firefox.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Firefox build to; blank: build this ref"
        default: ""

permissions:
  contents: read

env:
  WEB_EXT: web-ext@10.7.0
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

jobs:
  firefox:
    name: Lint and package the Firefox clipper
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write # to attach the build to a release
    defaults:
      run:
        working-directory: ./extensions/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - run: npm ci
      - name: Build the Firefox target
        env:
          EXT_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: npm run check -- --target firefox
      - name: web-ext lint (fails on errors; warnings are listed)
        run: npx --yes "$WEB_EXT" lint --source-dir dist/firefox
      - name: web-ext build
        run: npx --yes "$WEB_EXT" build --source-dir dist/firefox --artifacts-dir ../../dist/firefox --filename lens-clipper-firefox.zip --overwrite-dest
      - name: Sign for self-distribution
        if: (github.event_name == 'release' || inputs.tag != '') && env.AMO_JWT_ISSUER != ''
        run: |
          npx --yes "$WEB_EXT" sign --source-dir dist/firefox --artifacts-dir ../../dist/firefox/signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          for f in ../../dist/firefox/signed/*.xpi; do mv "$f" ../../dist/firefox/lens-clipper-firefox.xpi; done
      - uses: actions/upload-artifact@v7
        with:
          name: lens-clipper-firefox
          path: dist/firefox/lens-clipper-firefox.*
      - name: Attach the signed build to the release
        if: (github.event_name == 'release' || inputs.tag != '') && env.AMO_JWT_ISSUER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" ../../dist/firefox/lens-clipper-firefox.xpi --clobber --repo "${{ github.repository }}"
