name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

# Pushes to a pull request cancel its older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: [self-hosted, Linux, X64]

    env:
      # Only for importing the app to generate the OpenAPI schema; not a real secret.
      ACCESS_SECRET_KEY: ci-access-secret-key-0123456789abcdef
      OPENAPI_OUTPUT_FILE: ../nextjs-frontend/openapi.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # a cache that outlives the job on the self-hosted runner (the default is in the job's temp folder)
          cache-local-path: ${{ runner.environment == 'self-hosted' && format('{0}/uv-cache', runner.tool_cache) || '' }}
          python-version: "3.12"

      - name: Install the backend's dev tools
        working-directory: ./fastapi_backend
        # No optional extras: they are processing engines (torch, CUDA, macOS-only OCR), not needed for the hooks.
        run: uv sync --frozen

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nextjs-frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # on the self-hosted runner pnpm's store stays on disk; saving it to GitHub's cache took minutes
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: nextjs-frontend/pnpm-lock.yaml

      - name: Install Node dependencies
        working-directory: ./nextjs-frontend
        run: pnpm install --frozen-lockfile

      - name: Run pre-commit
        run: fastapi_backend/.venv/bin/pre-commit run --all-files --show-diff-on-failure
