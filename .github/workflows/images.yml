name: Images

# Lens's own images, prebuilt for amd64 and arm64 (a Raspberry Pi, Apple silicon, Graviton), pushed to GHCR for each
# release so an install can pull them instead of building (docs/deployment.md#prebuilt-images):
#
#   ghcr.io/<owner>/lens-backend:X.Y.Z-full  (also X.Y.Z, latest-full, latest)  the API and workers, full edition
#   ghcr.io/<owner>/lens-backend:X.Y.Z-lean  (also latest-lean)                 the same without LibreOffice and Chromium
#   ghcr.io/<owner>/lens-frontend:X.Y.Z      (also latest)                      the web app
#
# Each architecture builds on a runner of its own (GitHub's arm64 runner for arm64, no emulation), pushes by digest,
# and a last job joins the two into one tag. A release starts it with `tag` (a release published with GITHUB_TOKEN
# fires no release event, so release.yml runs it); by hand, give a release tag to (re)publish that version's images.
# A pull request that changes this file builds them all without pushing. Only the built-in GITHUB_TOKEN is used.
on:
  release:
    types: [published]
  pull_request:
    paths: [.github/workflows/images.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and push (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: images-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: backend-full, package: lens-backend, context: fastapi_backend, file: fastapi_backend/Dockerfile, target: full }
          - { name: backend-lean, package: lens-backend, context: fastapi_backend, file: fastapi_backend/Dockerfile, target: lean }
          - { name: frontend, package: lens-frontend, context: nextjs-frontend, file: nextjs-frontend/Dockerfile.prod, target: "" }
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Only a release tag
        if: env.PUSH == 'true'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' isn't a release tag (vX.Y.Z)"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Image name
        id: meta
        env:
          PACKAGE: ${{ matrix.image.package }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          # the source repository on the package's page, which also links the package to it
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ matrix.image.package }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.meta.outputs.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}

      - name: Keep the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: backend-full, package: lens-backend, tags: "{v}-full {v} latest-full latest" }
          - { name: backend-lean, package: lens-backend, tags: "{v}-lean latest-lean" }
          - { name: frontend, package: lens-frontend, tags: "{v} latest" }
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One tag for both architectures
        env:
          PACKAGE: ${{ matrix.image.package }}
          TAGS: ${{ matrix.image.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE"
          version="${TAG#v}"
          # latest only for the newest release, not for a backport or an older version published again
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' | { cat; echo "$TAG"; } | sort -V | tail -1)
          args=()
          for t in $TAGS; do
            case "$t" in latest*) [ "$newest" = "$TAG" ] || continue ;; esac
            args+=(-t "$image:${t//\{v\}/$version}")
          done
          digests=()
          for d in digests/*; do digests+=("$image@sha256:$(basename "$d")"); done
          [ "${#digests[@]}" = 2 ] || { echo "::error::expected 2 architectures, got ${#digests[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          {
            echo "### $image"
            for a in "${args[@]}"; do [ "$a" = -t ] || echo "- \`$a\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Both architectures are there
        env:
          PACKAGE: ${{ matrix.image.package }}
          TAGS: ${{ matrix.image.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE"
          first="${TAGS%% *}"
          ref="$image:${first//\{v\}/${TAG#v}}"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "$ref: $platforms"
          for p in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $p "* ]] || { echo "::error::$ref has no $p image"; exit 1; }
          done
