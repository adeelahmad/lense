name: Install

# The one-line install, end to end, on a clean runner: install.sh gets the code, writes the secrets, builds and starts
# the stack, and hands over a setup address that answers. Run again, it updates in place and keeps the secrets.
# It builds every image from scratch, so it runs only when what it installs changes, weekly, and by hand.
on:
  pull_request:
    paths:
      - install.sh
      - docker-compose.prod.yml
      - fastapi_backend/Dockerfile
      - fastapi_backend/pyproject.toml
      - fastapi_backend/uv.lock
      - fastapi_backend/start.sh
      - nextjs-frontend/Dockerfile
      - nextjs-frontend/package.json
      - nextjs-frontend/pnpm-lock.yaml
      - .github/workflows/install.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - docker-compose.prod.yml
      - .github/workflows/install.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install:
    name: One-line install
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      # the code under test: this pull request's branch (a fork's too), else the commit's branch
      LENS_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      LENS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      LENS_DIR: /tmp/lens-install
      LENS_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install (as a user would, piped into sh)
        run: |
          sh < install.sh | tee install.log
          grep -Eo 'http://[^ ]+/setup\?code=[A-Za-z0-9]{12}' install.log | head -1 > setup-url
          test -s setup-url || { echo "install.sh didn't hand over a setup address"; exit 1; }
          echo "Setup address: $(sed 's/code=.*/code=…/' setup-url)"

      - name: The setup address answers, and Lens waits for its first admin
        run: |
          url="$(cat setup-url)"
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          # answering already: install.sh waits for the API too, so the address works the moment it's handed over
          curl -fsS -o /dev/null "$url"
          status="$(curl -fsS "$base/api/v1/auth/status")"
          echo "$status"
          echo "$status" | grep -q '"setup_required":true'

      - name: Running it again updates in place and keeps the secrets
        run: |
          before="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          sh < install.sh
          after="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          test "$before" = "$after" || { echo "the second run changed the secrets"; exit 1; }
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: What the containers said
        if: failure()
        run: cd "$LENS_DIR" && docker compose -f docker-compose.prod.yml ps -a && docker compose -f docker-compose.prod.yml logs --tail 200

      - name: Stop
        if: always()
        run: |
          if [ -d "$LENS_DIR" ]; then
            cd "$LENS_DIR"
            docker compose -f docker-compose.prod.yml down -v || true
          fi
