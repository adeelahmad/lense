name: Install

# The one-line install, end to end, on a clean runner: install.sh gets the code, writes the secrets, builds and starts
# the stack, and hands over a setup address that answers. Run again, it updates in place and keeps the secrets.
# It builds every image from scratch, so it runs only when what it installs changes, weekly, and by hand.
on:
  pull_request:
    # closed: a pull request that's merged or closed cancels its runs that are still waiting or going (every job skips)
    types: [opened, synchronize, reopened, closed]
    paths:
      - install.sh
      - install.ps1
      - installer/**
      - docker-compose.prod.yml
      - fastapi_backend/Dockerfile
      - fastapi_backend/pyproject.toml
      - fastapi_backend/uv.lock
      - fastapi_backend/start.sh
      - microsandbox/**
      - nextjs-frontend/Dockerfile
      - nextjs-frontend/package.json
      - nextjs-frontend/pnpm-lock.yaml
      - packaging/host/**
      - .github/workflows/install.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - installer/**
      - docker-compose.prod.yml
      - microsandbox/**
      - packaging/host/**
      - .github/workflows/install.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  installer-tests:
    name: Web installer tests (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python it supports (a Mac's own, older Linux) and a current one; Windows and macOS run it too
        include:
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v installer
      - name: install.ps1 parses in Windows PowerShell 5.1, what Windows has
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  web-installer:
    name: Install from the web installer
    if: github.event.action != 'closed'
    # a runner of its own: the one-line install job builds the same images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LENS_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      LENS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      LENS_DIR: /tmp/lens-web
    steps:
      - uses: actions/checkout@v4

      # The runner comes with Docker; a new computer doesn't, so the installer has to install it (install.sh: from
      # get.docker.com) and use it as administrator for this run, as the person isn't in the docker group yet
      - name: A new computer, without Docker
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service 2>/dev/null || true
          pkgs="$(dpkg-query -W -f '${Package}\n' 2>/dev/null | grep -E '^(docker|moby|containerd|runc)' || true)"
          [ -z "$pkgs" ] || printf '%s\n' "$pkgs" | xargs sudo apt-get purge -y -q >/dev/null
          sudo rm -rf /usr/local/bin/docker* /usr/libexec/docker /usr/local/lib/docker /etc/apt/sources.list.d/docker* \
            /etc/apt/keyrings/docker* /var/lib/docker /var/lib/containerd /etc/docker
          sudo gpasswd -d "$(id -un)" docker 2>/dev/null || true
          hash -r
          if command -v docker; then echo "Docker is still here"; exit 1; fi

      - name: Start the installer, as install.sh does on a first install
        run: |
          LENS_INSTALLER_TOKEN=ci-token python3 installer/lens_installer.py --no-browser --port 3990 >installer.log 2>&1 &
          timeout 30 sh -c 'until curl -s -o /dev/null http://127.0.0.1:3990/; do sleep 1; done'
          cat installer.log
          # its link sets the cookie that every other call needs
          curl -fsS -c jar -o /dev/null "http://127.0.0.1:3990/?t=ci-token"
          curl -fsS -b jar http://127.0.0.1:3990/api/system >system.json
          jq '{os_name, docker, plan, port}' system.json
          # it says what it will install first: Docker, which this computer hasn't got
          jq -e '.docker.installed == false and (.plan.docker | map(.what) | any(startswith("Docker Engine")))' system.json

      - name: Answer it and install
        run: |
          jq -n --arg dir "$LENS_DIR" --arg ref "$LENS_REF" '{backend: "docker", target: "lean", dir: $dir, ref: $ref,
            settings: {llm: {base_url: "http://localhost:11434/v1", model: "llama3", api_key: "sk-ci"},
            budget: {hard_usd: 25, period: "month", price_in: 3, price_out: 15}}}' >answers.json
          curl -fsS -b jar -H 'X-Lens-Installer: 1' -H 'Content-Type: application/json' -d @answers.json \
            http://127.0.0.1:3990/api/install
          since=0
          while :; do
            p="$(curl -fsS -b jar "http://127.0.0.1:3990/api/progress?since=$since")"
            echo "$p" | jq -r '.lines[]' | tee -a install.log
            since="$(echo "$p" | jq .next)"
            state="$(echo "$p" | jq -r .state)"
            [ "$state" = running ] || break
            sleep 5
          done
          echo "$p" | jq '{state, url, error}'
          [ "$state" = "done" ] || exit 1
          echo "$p" | jq -r .url >setup-url
          grep -q 'Installing Docker (get.docker.com)' install.log || { echo "install.sh didn't install Docker"; exit 1; }

      - name: Lens answers, waits for its first admin, and has the installer's settings
        run: |
          url="$(cat setup-url)"
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          curl -fsS -o /dev/null "$url"
          curl -fsS "$base/api/v1/auth/status" | grep -q '"setup_required":true'
          cd "$LENS_DIR"
          # Docker as administrator: the person isn't in the docker group until they sign in again
          sudo docker compose -f docker-compose.prod.yml logs backend | grep "Applied the installer's settings: llm, budget"
          # saved in Lens: the key doesn't stay in .env
          ! grep -q '^LENS_SETUP_SETTINGS=' .env

      - name: What the installer and the containers said
        if: failure()
        run: |
          cat installer.log || true
          cd "$LENS_DIR" && sudo docker compose -f docker-compose.prod.yml ps -a && sudo docker compose -f docker-compose.prod.yml logs --tail 200

      - name: Stop
        if: always()
        run: |
          curl -fsS -b jar -H 'X-Lens-Installer: 1' -X POST -d '{}' http://127.0.0.1:3990/api/quit || true
          if [ -d "$LENS_DIR" ] && command -v docker; then
            cd "$LENS_DIR"
            sudo docker compose -f docker-compose.prod.yml down -v || true
          fi

  install:
    name: One-line install
    if: github.event.action != 'closed'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      # the code under test: this pull request's branch (a fork's too), else the commit's branch
      LENS_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      LENS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      LENS_DIR: /tmp/lens-install
      LENS_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install (as a user would, piped into sh)
        run: |
          sh < install.sh | tee install.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          grep -Eo 'http://[^ ]+/setup\?code=[A-Za-z0-9]{12}' install.log | head -1 > setup-url
          test -s setup-url || { echo "install.sh didn't hand over a setup address"; exit 1; }
          echo "Setup address: $(sed 's/code=.*/code=…/' setup-url)"

      - name: The setup address answers, and Lens waits for its first admin
        run: |
          url="$(cat setup-url)"
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          # answering already: install.sh waits for the API too, so the address works the moment it's handed over
          curl -fsS -o /dev/null "$url"
          status="$(curl -fsS "$base/api/v1/auth/status")"
          echo "$status"
          echo "$status" | grep -q '"setup_required":true'

      - name: Running it again updates in place and keeps the secrets
        run: |
          before="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          sh < install.sh
          after="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          test "$before" = "$after" || { echo "the second run changed the secrets"; exit 1; }
          test "$(stat -c %a "$LENS_DIR/.env")" = 600 || { echo "the second run left .env readable to others"; exit 1; }
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: An upgrade asked for in the web app is installed by the machine's agent
        run: |
          ctl="$LENS_DIR/.lens-control"
          grep -qx 'kind=systemd' "$ctl/agent" || { echo "install.sh set up no upgrade agent"; exit 1; }
          # what the web app writes (docs/updates.md): the branch this install follows, as a release tag would be
          printf 'id=ci\nref=%s\n' "$LENS_REF" > "$ctl/inbox/.upgrade.ci" && mv "$ctl/inbox/.upgrade.ci" "$ctl/inbox/upgrade"
          i=0
          until grep -qE '^state=(done|failed)$' "$ctl/upgrade-status" 2>/dev/null; do
            i=$((i + 1)); [ $i -gt 450 ] && { echo "the agent didn't finish within 15 minutes"; break; }
            sleep 2
          done
          cat "$ctl/upgrade-status" || true
          tail -20 "$ctl/upgrade.log" || true
          grep -qx 'id=ci' "$ctl/upgrade-status" && grep -qx 'state=done' "$ctl/upgrade-status"
          curl -fsS -o /dev/null "$(cat setup-url)"
          # and the containers see the folder, to ask for the next one
          cd "$LENS_DIR" && docker compose -f docker-compose.prod.yml exec -T backend sh -c 'test -w /control/inbox && cat /control/agent'

      - name: What the containers said
        if: failure()
        run: cd "$LENS_DIR" && docker compose -f docker-compose.prod.yml ps -a && docker compose -f docker-compose.prod.yml logs --tail 200

      - name: Stop
        if: always()
        run: |
          sudo systemctl disable --now lens-upgrade.path 2>/dev/null || true
          if [ -d "$LENS_DIR" ]; then
            cd "$LENS_DIR"
            docker compose -f docker-compose.prod.yml down -v || true
          fi

  microsandbox:
    name: One-line install in a microsandbox
    if: github.event.action != 'closed'
    # GitHub's own Linux runners: they have KVM, which microsandbox needs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LENS_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      LENS_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      LENS_DIR: /tmp/lens-install
      LENS_NO_OPEN: "1"
      LENS_BACKEND: microsandbox
      LENS_TARGET: lean
    steps:
      - uses: actions/checkout@v4

      # As on a new computer, KVM is there but this user may not use it yet (it's root's and the kvm group's): install.sh
      # gives them access itself
      - name: A new computer, whose user can't use KVM yet
        run: |
          ls -l /dev/kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "this runner's user can already use KVM"; exit 1; fi

      - name: Install (as a user would, piped into sh)
        run: |
          sh < install.sh | tee install.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          grep -Eo 'http://[^ ]+/setup\?code=[A-Za-z0-9]{12}' install.log | head -1 > setup-url
          test -s setup-url || { echo "install.sh didn't hand over a setup address"; exit 1; }
          grep -q 'Installing microsandbox' install.log || { echo "install.sh didn't install microsandbox"; exit 1; }
          grep -q "use KVM (the kvm group)" install.log || { echo "install.sh didn't give this user KVM"; exit 1; }

      - name: When this machine's DNS has no address for a name, the sandbox looks it up with public resolvers
        run: |
          export PATH="$HOME/.local/bin:$HOME/.microsandbox/bin:$PATH"
          msb exec lens -- sh /lens/microsandbox/test-dns.sh

      - name: The setup address answers, and Lens waits for its first admin
        run: |
          url="$(cat setup-url)"
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          curl -fsS -o /dev/null "$url"
          status="$(curl -fsS "$base/api/v1/auth/status")"
          echo "$status"
          echo "$status" | grep -q '"setup_required":true'
          grep -q '^LENS_BACKEND=microsandbox$' "$LENS_DIR/.env"

      - name: Running it again updates in place and keeps the secrets
        run: |
          # while it waited, it showed the steps the sandbox logged
          grep -q '  Building Lens' install.log || { echo "install.sh didn't show the sandbox's progress"; exit 1; }
          before="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          LENS_BACKEND='' sh < install.sh | tee again.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          after="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          test "$before" = "$after" || { echo "the second run changed the secrets"; exit 1; }
          test "$(stat -c %a "$LENS_DIR/.env")" = 600 || { echo "the second run left .env readable to others"; exit 1; }
          grep -q "Stopping the Lens that's running" again.log || { echo "the second run didn't stop the running sandbox first"; exit 1; }
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: A lean install stays lean when the line runs again without LENS_TARGET
        run: |
          LENS_BACKEND='' LENS_TARGET='' sh < install.sh >/dev/null
          grep -q '^LENS_TARGET=lean$' "$LENS_DIR/.env" || { echo "the run without LENS_TARGET changed the edition"; exit 1; }
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: The full edition installs Chromium the first time Lens needs it, and again at each start
        run: |
          export PATH="$HOME/.local/bin:$HOME/.microsandbox/bin:$PATH"
          LENS_BACKEND='' LENS_TARGET=full sh < install.sh >/dev/null
          if msb exec lens -- sh -c 'command -v chromium || command -v soffice'; then echo "it started with them"; exit 1; fi
          # as Lens asks for it: as the lens user, through convert.fetch_program
          msb exec lens -- setpriv --reuid lens --regid lens --init-groups -- \
            env LENS_PROGRAMS=/data/.lens/programs PYTHONPATH=/data/.lens/backend /data/.lens/venv/bin/python \
            -c 'from app.domain import convert; print(convert.fetch_program({}, "chromium", print))'
          msb exec lens -- chromium --version
          LENS_BACKEND='' LENS_TARGET='' sh < install.sh >/dev/null # the full edition is kept, and Chromium with it
          for _ in $(seq 60); do msb exec lens -- test -f /data/.lens/programs/got/chromium.ok && break; sleep 5; done
          msb exec lens -- chromium --version
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: A part of Lens that keeps stopping ends the wait at once, with what Lens logged
        run: |
          # a key the API won't start with (shorter than 16 characters): it stops at each start
          cp "$LENS_DIR/.env" env.bak
          sed -i 's/^ACCESS_SECRET_KEY=.*/ACCESS_SECRET_KEY=short/' "$LENS_DIR/.env"
          if LENS_BACKEND='' sh < install.sh >loop.log 2>&1; then cat loop.log; echo "it didn't stop waiting"; exit 1; fi
          cat loop.log
          grep -q "keeps stopping in its microsandbox" loop.log
          grep -q 'The last lines Lens logged:' loop.log
          grep -q 'ACCESS_SECRET_KEY' loop.log # the reason, in Lens's own words
          cp env.bak "$LENS_DIR/.env"
          LENS_BACKEND='' sh < install.sh >/dev/null
          curl -fsS -o /dev/null "$(cat setup-url)"

      - name: A start that takes too long stops waiting and says why
        run: |
          if LENS_BACKEND='' LENS_WAIT=8 sh < install.sh >slow.log 2>&1; then cat slow.log; echo "it didn't stop waiting"; exit 1; fi
          cat slow.log
          grep -q "Lens didn't answer on port [0-9]* within 8 seconds" slow.log
          grep -q 'The last lines Lens logged:' slow.log

      - name: Installing again after the install folder is deleted starts Lens on a volume of its own
        run: |
          export PATH="$HOME/.local/bin:$HOME/.microsandbox/bin:$PATH"
          # the folder held the keys that open lens-data's database; an empty volume of the next name is used as it is
          msb volume create lens-data-2
          rm -rf "$LENS_DIR"
          sh < install.sh | tee fresh.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          grep -q 'Starting Lens on a microsandbox volume of its own, lens-data-2' fresh.log
          grep -q '^LENS_VOLUME=lens-data-2$' "$LENS_DIR/.env" || { echo "the new install didn't start on a volume of its own"; exit 1; }
          msb volume ls -q | grep -qx lens-data || { echo "the earlier install's volume is gone"; exit 1; }
          url="$(grep -Eo 'http://[^ ]+/setup\?code=[A-Za-z0-9]{12}' fresh.log | head -1)"
          test -n "$url" || { echo "install.sh didn't hand over a setup address"; exit 1; }
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          curl -fsS "$base/api/v1/auth/status" | grep -q '"setup_required":true'
          # running the line again keeps that volume
          LENS_BACKEND='' sh < install.sh >/dev/null
          grep -q '^LENS_VOLUME=lens-data-2$' "$LENS_DIR/.env"
          curl -fsS -o /dev/null "$url"

      - name: An install whose keys don't open its volume's database moves to a volume of its own when the line runs again
        run: |
          export PATH="$HOME/.local/bin:$HOME/.microsandbox/bin:$PATH"
          # as an install that a reinstall gave new keys before LENS_VOLUME was kept: it runs on lens-data, whose database
          # the first install's keys made (lens-data-2 holds the one this .env's earlier keys made)
          sed -i '/^LENS_VOLUME=/d' "$LENS_DIR/.env"
          for k in ACCESS_SECRET_KEY ARCHIVE_SECRET_KEY AUTH_SECRET SURREAL_PASS; do
            sed -i "s/^$k=.*/$k=$(openssl rand -hex 32)/" "$LENS_DIR/.env"
          done
          before="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          LENS_BACKEND='' sh < install.sh | tee moved.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          grep -q "Another install's database" moved.log || { echo "the sandbox didn't say the keys don't open the database"; exit 1; }
          grep -q 'Starting Lens on a microsandbox volume of its own, lens-data-3' moved.log
          grep -q '^LENS_VOLUME=lens-data-3$' "$LENS_DIR/.env" || { echo "the install didn't move to a volume of its own"; exit 1; }
          grep -q "lens-data-3" "$LENS_DIR/.lens-sandbox" || { echo ".lens-sandbox still starts the earlier volume"; exit 1; }
          after="$(grep -E '^(ACCESS_SECRET_KEY|ARCHIVE_SECRET_KEY|AUTH_SECRET|SURREAL_PASS|LENS_SETUP_CODE)=' "$LENS_DIR/.env" | sha256sum)"
          test "$before" = "$after" || { echo "moving changed the keys"; exit 1; }
          for v in lens-data lens-data-2; do msb volume ls -q | grep -qx "$v" || { echo "the volume $v is gone"; exit 1; }; done
          url="$(grep -Eo 'http://[^ ]+/setup\?code=[A-Za-z0-9]{12}' moved.log | head -1)"
          test -n "$url" || { echo "install.sh didn't hand over a setup address"; exit 1; }
          base="http://127.0.0.1:${url##*:}"; base="${base%%/setup*}"
          curl -fsS "$base/api/v1/auth/status" | grep -q '"setup_required":true'
          # running the line again stays on it
          LENS_BACKEND='' sh < install.sh | tee stay.log
          test "${PIPESTATUS[0]}" = 0 || { echo "install.sh failed"; exit 1; }
          if grep -q 'volume of its own' stay.log; then echo "it moved again"; exit 1; fi
          grep -q '^LENS_VOLUME=lens-data-3$' "$LENS_DIR/.env"
          curl -fsS -o /dev/null "$url"

      - name: What the sandbox said
        if: failure()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          msb doctor || true
          msb ls || true
          msb logs lens --tail 300 || true

      - name: Stop
        if: always()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          msb rm -f lens || true
