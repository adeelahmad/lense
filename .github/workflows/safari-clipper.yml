name: Safari clipper

# The web clipper wrapped as a Safari Web Extension (a macOS app carrying it), built on macOS with Xcode. On a pull
# request that changes the extension it's built and kept with the run; on a release, or a workflow_dispatch with
# `tag`, it's attached to the release. Unsigned unless the SAFARI_TEAM_ID secret is set.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Safari clipper to; blank: build this ref"
        default: ""
  pull_request:
    paths:
      - extensions/browser/**
      - .github/workflows/safari-clipper.yml

permissions:
  contents: read

jobs:
  safari:
    name: Build the Safari clipper
    runs-on: macos-latest
    permissions:
      contents: write # to attach it to the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/browser/package-lock.json
      - name: Build
        env:
          EXT_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          SAFARI_TEAM_ID: ${{ secrets.SAFARI_TEAM_ID }}
        run: extensions/browser/safari/build.sh "$RUNNER_TEMP/safari"
      - uses: actions/upload-artifact@v7
        with:
          name: lens-clipper-safari
          path: ${{ runner.temp }}/safari/lens-clipper-safari.zip
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/safari/lens-clipper-safari.zip" --clobber --repo "${{ github.repository }}"
