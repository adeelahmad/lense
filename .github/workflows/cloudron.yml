name: Cloudron image

# Builds the Cloudron package (Dockerfile.cloudron) when it changes. A published release pushes the image to GHCR,
# tagged with the release version and `latest`; the Release workflow starts it with `tag` (a release published with
# GITHUB_TOKEN fires no release event). Run by hand without `tag`, it pushes the manifest's version. The image is for
# `cloudron install --image` or `cloudron versions add` (cloudron/README.md).
on:
  release:
    types: [published]
  pull_request:
    paths: [Dockerfile.cloudron, CloudronManifest.json, cloudron/**, .dockerignore]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and push as that version and latest (vX.Y.Z); empty: the manifest's version"
        type: string
        default: ""
      push:
        description: "Push to ghcr.io/<owner>/lens-cloudron"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Image name and tags (the release's version, else the manifest's)
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUSH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.push || inputs.tag != '')) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lens-cloudron"
          version="${RELEASE_TAG#v}"
          [ -n "$version" ] || version=$(jq -r .version CloudronManifest.json)
          tags="$image:$version"
          [ -z "$RELEASE_TAG" ] || tags="$tags,$image:latest"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

      # Cloudron runs amd64 images; an Apple silicon runner builds them under QEMU
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloudron
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # GitHub's cache only on GitHub's runners: uploading layers from a home connection takes longer than building
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}

      - name: Summary
        if: steps.meta.outputs.push == 'true'
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Make the package public on GitHub so Cloudron can pull it." >> "$GITHUB_STEP_SUMMARY"
