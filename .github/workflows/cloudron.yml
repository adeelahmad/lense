name: Cloudron image

# Builds the Cloudron package (Dockerfile.cloudron) when it changes. A published release pushes the image to GHCR,
# tagged with the release version and `latest`; run it by hand to push the manifest's version. The image is for
# `cloudron install --image` or `cloudron versions add` (cloudron/README.md).
on:
  release:
    types: [published]
  pull_request:
    paths: [Dockerfile.cloudron, CloudronManifest.json, cloudron/**, .dockerignore]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io/<owner>/lens-cloudron"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags (the release's version, else the manifest's)
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lens-cloudron"
          version="${RELEASE_TAG#v}"
          [ -n "$version" ] || version=$(jq -r .version CloudronManifest.json)
          tags="$image:$version"
          [ -z "$RELEASE_TAG" ] || tags="$tags,$image:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloudron
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.meta.outputs.push == 'true'
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Make the package public on GitHub so Cloudron can pull it." >> "$GITHUB_STEP_SUMMARY"
