name: Synology package

# Publishing a release builds both packages and attaches them to it. It can also be run from the Actions tab, which
# attaches the .spk files to the run instead.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Backend image: lean, or full (LibreOffice and Chromium; a much bigger package)"
        default: lean
        type: choice
        options: [lean, full]
      build:
        description: "Package build number (raise it to upgrade an installed package of the same version)"
        default: "0001"

jobs:
  spk:
    name: SPK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the packages to the release
    strategy:
      matrix:
        arch: [x86_64, armv8]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armv8'
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          LENS_TARGET: ${{ inputs.target || 'lean' }}
          INPUT_BUILD: ${{ inputs.build }}
          RUN_NUMBER: ${{ github.run_number }}
        # a release numbers its packages by run, so each one installs as an upgrade over the last
        run: BUILD=${INPUT_BUILD:-$(printf '%04d' "$RUN_NUMBER")} packaging/synology/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lens-synology-${{ matrix.arch }}
          path: dist/synology/*.spk
          compression-level: 0
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/synology/*.spk --clobber --repo "${{ github.repository }}"
