#
# Lens for QNAP (QTS 5 / QuTS hero), built with QDK: https://github.com/qnap-dev/QDK
# packaging/qnap/build.sh fills in QPKG_VER and the per-architecture image folders (x86_64/, arm_64/).
#
QPKG_NAME="Lens"
QPKG_DISPLAY_NAME="Lens"
QPKG_VER="0.3.0"
QPKG_AUTHOR="Adeel Ahmad"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Searchable archive of your recordings and documents: transcripts, entities, chat."
QPKG_RC_NUM="190"
QPKG_SERVICE_PROGRAM="lens.sh"

# The containers run in Container Station's Docker engine, which also stores their images.
QPKG_REQUIRE="container-station >= 3.0"
QPKG_REQUIRE_MSG="Lens runs in Container Station. Install Container Station 3 from the App Center, then install Lens again."
QTS_MINI_VERSION="5.0.0"

# The web app. lens.sh rewrites Web_Port from LENS_PORT in the data folder's lens.env.
QPKG_WEB_PORT="3000"
QPKG_WEBUI="/"
QPKG_DESKTOP_APP="0"

# Loading the bundled images on the first start takes a few minutes.
QPKG_TIMEOUT="900,180"

QPKG_VOLUME_SELECT="1"
