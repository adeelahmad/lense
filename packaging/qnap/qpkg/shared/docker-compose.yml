# The Lens stack on a QNAP NAS, run by lens.sh in Container Station's Docker engine (project "lens").
# The images come inside the QPKG (lens-backend and lens-frontend tagged qnap-<version>, and SurrealDB) and
# are loaded on the first start, so nothing is pulled or built on the NAS.
# Settings and secrets: lens.env in the data folder (LENS_DATA), written on the first start. Everything Lens keeps
# lives under LENS_DATA, which outlasts removing the app.

x-backend: &backend
  security_opt: ["no-new-privileges:true"]  # nothing in Lens needs setuid programs
  image: lens-backend:qnap-${LENS_VERSION:?}
  environment:
    ARCHIVE_CONFIG: /qnap/archive.yaml
    ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY:?set ACCESS_SECRET_KEY in lens.env}
    ARCHIVE_SECRET_KEY: ${ARCHIVE_SECRET_KEY:?set ARCHIVE_SECRET_KEY in lens.env}
    LENS_SETUP_CODE: ${LENS_SETUP_CODE:-}
    SURREAL_URL: ws://surrealdb:8000
    SURREAL_USER: root
    SURREAL_PASS: ${SURREAL_PASS:?set SURREAL_PASS in lens.env}
    RUN_BACKGROUND: "false"
    FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in lens.env}
    LENS_TUNNEL_ORIGIN: http://frontend:3000  # where the Cloudflare tunnel (Settings › Remote access) sends visitors
    # the web app's container (and the one running the tunnel): their X-Forwarded-For names the visitor, for throttles
    LENS_TRUSTED_PROXY_HOSTS: frontend,backend,worker
    CORS_ORIGINS: '["${FRONTEND_URL}"]'
    ARCHIVE_ALLOWED_HOSTS: ${ARCHIVE_ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
    MAIL_SERVER: ${MAIL_SERVER:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-}
    # Optional answers to the first-run setup (empty means the web app asks)
    LENS_ADMIN_EMAIL: ${LENS_ADMIN_EMAIL:-}
    LENS_ADMIN_PASSWORD: ${LENS_ADMIN_PASSWORD:-}
    LENS_ADMIN_NAME: ${LENS_ADMIN_NAME:-}
    LENS_NAMESPACE: ${LENS_NAMESPACE:-}
    LENS_LLM_BASE_URL: ${LENS_LLM_BASE_URL:-}
    LENS_LLM_MODEL: ${LENS_LLM_MODEL:-}
    LENS_LLM_API_KEY: ${LENS_LLM_API_KEY:-}
    LENS_LLM_VISION_MODEL: ${LENS_LLM_VISION_MODEL:-}
    # opt-in telemetry (docs/telemetry.md): unset, it stays off unless turned on in Settings
    LENS_TELEMETRY: ${LENS_TELEMETRY:-}
    LENS_TELEMETRY_ENDPOINT: ${LENS_TELEMETRY_ENDPOINT:-}
    LENS_TELEMETRY_HEADERS: ${LENS_TELEMETRY_HEADERS:-}
    LENS_SETUP_WIZARD: ${LENS_SETUP_WIZARD:-}
  volumes:
    - ./archive.yaml:/qnap/archive.yaml:ro
    - ${LENS_DATA:?}/archive:/data
    - ${AUDIO_DIR:?set AUDIO_DIR in lens.env}:/audio:ro
  depends_on:
    surrealdb:
      condition: service_healthy
  restart: unless-stopped
  networks: [lens]

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    command: start --log info --user root --pass ${SURREAL_PASS:?} surrealkv:/data/lens.db
    user: root
    volumes:
      - ${LENS_DATA:?}/surrealdb:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    networks: [lens]

  backend:
    <<: *backend

  worker:
    <<: *backend
    command: lens worker
    healthcheck:
      disable: true

  frontend:
    security_opt: ["no-new-privileges:true"]
    image: lens-frontend:qnap-${LENS_VERSION:?}
    environment:
      API_BASE_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in lens.env}
      AUTH_TRUST_HOST: "true"
      # no AUTH_URL: sign-in follows the address the browser is on (its LAN name, https:// address or Cloudflare tunnel)
    ports:
      - "${LENS_PORT:-3000}:3000"
    depends_on: [backend]
    restart: unless-stopped
    networks: [lens]

networks:
  lens:
    driver: bridge
