# Local development stack: SurrealDB, the API (hot reload), a job worker, the Next.js frontend and Mailpit (catches the mail).
#   cp fastapi_backend/.env.example fastapi_backend/.env   (set ACCESS_SECRET_KEY)
#   cp nextjs-frontend/.env.example nextjs-frontend/.env.local   (set AUTH_SECRET)
#   docker compose up
# The first-admin setup code is printed in the backend log.

x-backend: &backend
  build:
    context: fastapi_backend
    target: ${LENS_TARGET:-lean}  # full: LibreOffice and Chromium, to read Office files, text, web pages and emails
    args:
      DEV: "true"
      EXTRAS: ${EXTRAS:-}
  # model servers on this machine (Ollama, LM Studio) as host.docker.internal, on Linux as on a Mac
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - path: .env                    # ARCHIVE_SECRET_KEY: the one native runs use, so both read stored credentials
      required: false
    - path: fastapi_backend/.env
      required: false
  environment: &backend-env
    ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY:-dev-only-access-secret-change-me}
    SURREAL_URL: ws://surrealdb:8000
    SURREAL_USER: ${SURREAL_USER:-root}
    SURREAL_PASS: ${SURREAL_PASS:-root}
    ARCHIVE_CONFIG: /app/docker/archive.yaml
    RUN_BACKGROUND: "false"
    MAIL_SERVER: mail
    MAIL_PORT: "1025"
    MAIL_FROM: lens@example.com
    MAIL_STARTTLS: "False"
    USE_CREDENTIALS: "False"
    FRONTEND_URL: http://localhost:3000
    CORS_ORIGINS: '["http://localhost:3000"]'
    OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
  volumes:
    - ./fastapi_backend:/app
    # the image's own packages, not the source tree's: anonymous, so `make dev` (up --build --renew-anon-volumes)
    # starts from the rebuilt image's after a dependency changes
    - /opt/venv
    - archive-data:/data
    - ./local-shared-data:/app/shared-data
    - ${AUDIO_DIR:-./local-audio}:/audio:ro
  depends_on:
    surrealdb:
      condition: service_healthy
  networks: [lens]

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} surrealkv:/data/lens.db
    user: root                      # the image's default user cannot write to a fresh named volume
    ports:
      - "127.0.0.1:8001:8000"       # lets native workers on this machine (mlx on a Mac) share the database
    volumes:
      - surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lens]

  backend:
    <<: *backend
    command: ./start.sh
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: lens worker
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
    volumes:
      - ./nextjs-frontend:/app
      - /app/node_modules       # the image's, renewed with it (see the backend's /opt/venv)
      - ./local-shared-data:/app/shared-data
    networks: [lens]

  # Catches the mail the API sends (password resets, access requests): read it at http://localhost:8025.
  # Mailpit has images for arm64 and amd64 (MailHog's is amd64 only).
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025" # SMTP, for an API run outside Docker (MAIL_SERVER=localhost)
      - "127.0.0.1:8025:8025" # the mailbox
    networks: [lens]

volumes:
  surreal-data:
  archive-data:

networks:
  lens:
    driver: bridge
