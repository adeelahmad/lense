# Local development stack: SurrealDB, the API (hot reload), a job worker, the Next.js frontend and Mailpit (catches the mail).
#   cp fastapi_backend/.env.example fastapi_backend/.env   (set ACCESS_SECRET_KEY)
#   cp nextjs-frontend/.env.example nextjs-frontend/.env.local   (set AUTH_SECRET)
#   docker compose up
# The first-admin setup code is printed in the backend log.

x-backend: &backend
  security_opt: ["no-new-privileges:true"]  # nothing in Lens needs setuid programs
  build:
    context: fastapi_backend
    target: ${LENS_TARGET:-full}  # LibreOffice and Chromium, to read Office files, text, web pages and emails; lean: without
    args:
      DEV: "true"
      EXTRAS: ${EXTRAS:-}
  # model servers on this machine (Ollama, LM Studio) as host.docker.internal, on Linux as on a Mac
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - path: .env                    # ARCHIVE_SECRET_KEY: the one native runs use, so both read stored credentials
      required: false
    - path: fastapi_backend/.env
      required: false
  environment: &backend-env
    ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY:-dev-only-access-secret-change-me}
    SURREAL_URL: ws://surrealdb:8000
    SURREAL_USER: ${SURREAL_USER:-root}
    SURREAL_PASS: ${SURREAL_PASS:-root}
    LENS_NFS_PORT: ${LENS_NFS_PORT:-12049}
    ARCHIVE_CONFIG: /app/docker/archive.yaml
    RUN_BACKGROUND: "false"
    MAIL_SERVER: mail
    MAIL_PORT: "1025"
    MAIL_FROM: lens@example.com
    MAIL_STARTTLS: "False"
    USE_CREDENTIALS: "False"
    FRONTEND_URL: http://localhost:3000
    # where the Cloudflare tunnel (Settings › Remote access) sends visitors: the web app inside this stack
    LENS_TUNNEL_ORIGIN: http://frontend:3000
    # the web app's container (and the one running the tunnel): their X-Forwarded-For names the visitor, for throttles
    LENS_TRUSTED_PROXY_HOSTS: frontend,backend,worker
    # the SMB share of the file tree (docs/smb.md): listens on 4445 in the container; LENS_SMB_PORT is where it's
    # published, for the address Settings shows
    LENS_SMB_LISTEN: 0.0.0.0
    LENS_SMB_PORT: ${LENS_SMB_PORT:-1445}
    CORS_ORIGINS: '["http://localhost:3000"]'
    OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
    # the volume shared with the matterbridge service (its config, written from Settings → Chat rooms)
    LENS_MATTERBRIDGE_DIR: /matterbridge
    # the MCP runner (the optional `mcp` service, docs/assistant.md): MCP servers that run as a program, sandboxed there
    LENS_MCP_RUNNER_URL: http://mcp:8090
    LENS_MCP_TOKEN_FILE: /mcp-key/token
    # the code sandbox's gateway (the optional `sandbox` profile, docs/assistant.md#code-sandbox): the client
    # certificate Lens signs in to it with
    LENS_SANDBOX_TLS_DIR: /sandbox-key
  volumes:
    - ./fastapi_backend:/app
    # the image's own packages, not the source tree's: anonymous, so `make dev` (up --build --renew-anon-volumes)
    # starts from the rebuilt image's after a dependency changes
    - /opt/venv
    - archive-data:/data
    - ./local-shared-data:/app/shared-data
    - ${AUDIO_DIR:-./local-audio}:/audio:ro
    - matterbridge-data:/matterbridge
    - mcp-key:/mcp-key:ro
    - sandbox-key:/sandbox-key:ro
  depends_on:
    surrealdb:
      condition: service_healthy
  networks: [lens, mcp, sandbox]

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    command: start --log info --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} surrealkv:/data/lens.db
    user: root                      # the image's default user cannot write to a fresh named volume
    ports:
      - "127.0.0.1:8001:8000"       # lets native workers on this machine (mlx on a Mac) share the database
    volumes:
      - surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lens]

  backend:
    <<: *backend
    command: ./start.sh
    ports:
      - "127.0.0.1:8000:8000"         # the API, for this machine only (the web app proxies it)

  worker:
    <<: *backend
    command: lens worker
    # the sensor hub (docs/sensors.md): MQTT and syslog, listened on only once sensors are turned on in the app.
    # Something else on this machine using 1883 or 5514? Set LENS_MQTT_PORT / LENS_SYSLOG_PORT to other ports.
    # Only this machine reaches them while developing; LENS_SENSOR_BIND=0.0.0.0 lets devices on the network in.
    ports:
      - "${LENS_SENSOR_BIND:-127.0.0.1}:${LENS_MQTT_PORT:-1883}:1883"
      - "${LENS_SENSOR_BIND:-127.0.0.1}:${LENS_SYSLOG_PORT:-5514}:5514/udp"
      - "${LENS_SENSOR_BIND:-127.0.0.1}:${LENS_SYSLOG_PORT:-5514}:5514/tcp"
      - "${LENS_SHARE_BIND:-127.0.0.1}:${LENS_NFS_PORT:-12049}:2049"  # the file tree over NFS, once turned on
      - "${LENS_SHARE_BIND:-127.0.0.1}:${LENS_SMB_PORT:-1445}:4445"  # the file tree over SMB, once turned on
      # the graph as files over S3 and WebDAV (docs/file-tree.md), once File shares are on; LENS_S3_PORT / LENS_WEBDAV_PORT
      - "${LENS_SHARE_BIND:-127.0.0.1}:${LENS_S3_PORT:-9555}:9555"
      - "${LENS_SHARE_BIND:-127.0.0.1}:${LENS_WEBDAV_PORT:-9556}:9556"
    healthcheck:
      disable: true

  frontend:
    security_opt: ["no-new-privileges:true"]
    build:
      context: ./nextjs-frontend
    user: node
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me}
      AUTH_TRUST_HOST: "true"
      # no AUTH_URL: sign-in follows the address the browser is on (its LAN name, https:// address or Cloudflare tunnel)
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
      # the file shares at the web app's address, /s3 and /dav, once allowed in Settings › File shares, and MQTT over
      # WebSockets at /mqtt, once allowed in Settings › Sensors (lens-relay.js)
      NODE_OPTIONS: --require /app/lens-relay.js
      LENS_S3_URL: http://worker:9555
      LENS_WEBDAV_URL: http://worker:9556
      LENS_MQTT_WS_URL: http://worker:9883
    volumes:
      - ./nextjs-frontend:/app
      - /app/node_modules       # the image's, renewed with it (see the backend's /opt/venv)
      - ./local-shared-data:/app/shared-data
    networks: [lens]

  # Catches the mail the API sends (password resets, access requests): read it at http://localhost:8025.
  # Mailpit has images for arm64 and amd64 (MailHog's is amd64 only).
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025" # SMTP, for an API run outside Docker (MAIL_SERVER=localhost)
      - "127.0.0.1:8025:8025" # the mailbox
    networks: [lens]

  # Matterbridge run by Lens (docs/chat-rooms.md): the assistant in Slack, Discord, Telegram, Matrix and WhatsApp rooms,
  # set up in Settings → Chat rooms → Run Matterbridge here, which writes its config into the volume the two share.
  # Opt-in, and it builds Matterbridge from source the first time: `docker compose --profile matterbridge up -d`.
  matterbridge:
    security_opt: ["no-new-privileges:true"]
    image: lens-matterbridge:dev
    build: ./matterbridge
    profiles: [matterbridge]
    volumes:
      - matterbridge-data:/matterbridge
    networks: [lens]

  # Apache Tika (docs/configuration.md#apache-tika): reads the text and description of about a thousand kinds of file where Lens can't make
  # them into PDFs itself, and what every document says about itself. Opt-in, about 250 MB of memory:
  # `docker compose --profile tika up -d` (or COMPOSE_PROFILES=tika in .env), then Settings → Documents → Tika server:
  # http://tika:9998. Reachable only inside Lens's network; it has no sign-in of its own.
  tika:
    image: apache/tika:${TIKA_VERSION:-4.0.0-1}
    profiles: [tika]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${TIKA_HEAP:-512m}
    networks: [lens]

  # The MCP runner (mcp-runner/runner.py, docs/assistant.md): MCP servers that run as a program (stdio, usually npx or
  # uvx), which admins add as extensions. Opt-in: `docker compose --profile mcp up -d`, or COMPOSE_PROFILES=mcp in .env.
  # The sandbox: none of Lens's data or keys, no capabilities, a read-only image, and a network shared only with the
  # backend (and the internet).
  mcp:
    image: lens-mcp:dev
    build: ./mcp-runner
    profiles: [mcp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    pids_limit: 512
    volumes:
      - mcp-data:/data
      - mcp-key:/key
    networks: [mcp]

  # The code sandbox's NVIDIA OpenShell gateway (docs/assistant.md#code-sandbox): Python and bash for the assistant, one
  # sandbox container per conversation, made through this machine's Docker. Opt-in: Settings → Code sandbox → Start
  # the gateway (the upgrade agent adds `sandbox` to COMPOSE_PROFILES and starts these), or
  # `docker compose --profile sandbox up -d openshell-gateway`. Linux only, with Landlock (Linux 6.2 or newer).
  # openshell-init makes the gateway's certificates once, in /var/lib/openshell on this machine (the gateway has
  # Docker mount files from it into the sandboxes, so it is the same folder inside and out); openshell-key copies the
  # client's to the sandbox-key volume, readable by Lens only. Lens reaches the gateway on the sandbox network over
  # mutual TLS; each sandbox's supervisor reaches it on this machine's 127.0.0.1:17670.
  openshell-init:
    image: ghcr.io/nvidia/openshell/gateway:0.1.4
    profiles: [sandbox]
    user: "0"
    network_mode: none
    command: ["generate-certs", "--output-dir", "/var/lib/openshell/tls", "--server-san", "openshell-gateway"]
    environment:
      HOME: /var/lib/openshell
    volumes:
      - &openshell-data
        type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
    restart: "no"

  openshell-key:
    image: python:3.12-slim  # the sandboxes' default image too, so nothing extra is downloaded
    profiles: [sandbox]
    user: "0"
    network_mode: none
    depends_on:
      openshell-init:
        condition: service_completed_successfully
    command:
      - python3
      - -c
      - |
        import os, shutil
        for src, dst in (("ca.crt", "ca.crt"), ("client/tls.crt", "tls.crt"), ("client/tls.key", "tls.key")):
            shutil.copyfile("/tls/" + src, "/key/" + dst + ".new")
            os.chown("/key/" + dst + ".new", 1000, 1000)
            os.chmod("/key/" + dst + ".new", 0o400)
            os.replace("/key/" + dst + ".new", "/key/" + dst)
    volumes:
      - /var/lib/openshell/tls:/tls:ro
      - sandbox-key:/key
    restart: "no"

  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:0.1.4
    profiles: [sandbox]
    user: "0"  # it drives Docker through its socket
    command: ["--bind-address", "0.0.0.0", "--port", "17670"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      openshell-key:
        condition: service_completed_successfully
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      OPENSHELL_LOCAL_TLS_DIR: /var/lib/openshell/tls
      OPENSHELL_TELEMETRY_ENABLED: "false"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
    ports:
      - "127.0.0.1:17670:17670"  # this machine only: the sandboxes' supervisors, on the host's network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - *openshell-data
      - ./sandbox/gateway.toml:/etc/openshell/gateway.toml:ro
    restart: unless-stopped
    networks: [sandbox]

  # StyleTTS2 (docs/speech-providers.md#styletts2): spoken answers and podcasts read on this machine, in a voice like a
  # short clip you put in its voices volume. Heavy (PyTorch and a 1 GB model, fetched on first use), so opt-in:
  # `docker compose --profile styletts2 up -d`, then Settings → AI assistant → Voice → StyleTTS2.
  styletts2:
    security_opt: ["no-new-privileges:true"]
    image: lens-styletts2:dev
    build: ./styletts2
    profiles: [styletts2]
    volumes:
      - styletts2-data:/data
      - styletts2-voices:/voices
    networks: [lens]

  # Fedora 6 (docs/fedora.md), the repository Lens can keep a copy of the archive in. Opt-in, and not needed on small
  # machines: `docker compose --profile fedora up`, with LENS_FEDORA_URL=http://fedora:8080/fcrepo/rest (and
  # LENS_FEDORA_USER / LENS_FEDORA_PASSWORD) in .env, or set it in Settings → Fedora.
  fedora:
    image: fcrepo/fcrepo:${FEDORA_VERSION:-6.5.1-tomcat9}
    profiles: [fedora]
    environment:
      CATALINA_OPTS: >-
        -Dfcrepo.home=/fcrepo-home -Djava.awt.headless=true -Dfcrepo.autoversioning.enabled=true
    ports:
      - "127.0.0.1:8081:8080"       # its web UI and REST API, for this machine only
    volumes:
      - fedora-data:/fcrepo-home
    networks: [lens]

volumes:
  surreal-data:
  matterbridge-data:
  mcp-data:
  mcp-key:
  sandbox-key:
  styletts2-data:
  styletts2-voices:
  archive-data:
  fedora-data:

networks:
  lens:
    driver: bridge
  mcp:
    driver: bridge
  sandbox:
    driver: bridge
