# ---------------------------------------------------------------- §1.11
# Two records with an MX- prefix are matrix-derived: the §1.7 matrix marks those
# rows `claimed` (documented) but names no §1.11 ID, and the v2 schema needs a
# property_id on every claimed row. They add no claim beyond the matrix row.
properties_claimed:
  - id: P-NS-ISOLATION
    kind: confidentiality
    components: [authz]
    tier: security-critical
    conditions: "a principal with no role in a namespace and no grant for a recording cannot read or change anything in it, except what the recording's access level opens to anyone (P-ACCESS-PARTS); the namespace and its recordings answer 404; grants for one recording open only that recording's visitor pages and IIIF"
    violation_symptoms: [info-leak, integrity-bypass]
    x-voided-by: "admins own every namespace (domain/auth.py:356-357, api/deps.py:160); share or signed link grants viewer on one recording (api/deps.py:252); collection role adds to namespace role (api/deps.py:183); visitor-address trust (api/deps.py:339-346); checks are per handler, no central policy (Q8)"
    provenance: {kind: documented, source: 'SECURITY.md "reading or changing anything in a namespace you have no role in"'}
  - id: P-ACCESS-PARTS
    kind: confidentiality
    components: [authz]
    tier: security-critical
    x-tier-question: Q37
    conditions: "a closed part of a public recording, and any restricted or private recording, opens only for a role, permission, IP group or link; a closed transcript's text stays out of search and downloads; only owners change access and open parts"
    violation_symptoms: [info-leak]
    x-voided-by: "an owner opening parts or making a recording public; a moved recording keeps its old access"
    provenance: {kind: documented, source: 'docs/access.md "the parts of a public recording anyone may use"'}
  - id: P-ROLE
    kind: integrity
