# ---------------------------------------------------------------- §1.7 trust table
entry_points:
  - id: "every /api/v1/* route"
    component: identity
    parameters:
      - name: "Authorization: Bearer (web JWT, la_ API token, lo_ app token)"
        attacker_controllable: true
        control_kinds: [data, serialized-state]
        obligation_id: keep-bearer-secret
        caller_must_enforce: "holder keeps it secret; Lens checks signature or hash, expiry, account, session"
        provenance: {kind: documented, source: 'docs/authentication.md "Every request checks that the account is still active"'}
  - id: "every request"
    component: web
    parameters:
      - name: "Host header"
        attacker_controllable: true
        control_kinds: [resource-name]
        obligation_id: list-served-hosts
        caller_must_enforce: "operator lists served hosts"
        provenance: {kind: documented, source: 'docs/configuration.md "checks the `Host` header"'}
  - id: "IP groups, throttles"
    component: authz
    parameters:
      - name: "X-Forwarded-For, peer address"
        attacker_controllable: true
        x-condition: "honoured only from trusted proxies"
        control_kinds: [x-trusted-header]
        obligation_id: trusted-proxy-chain
        caller_must_enforce: "a reverse proxy sets the header; trusted_proxies lists exactly the front hops"
        provenance: {kind: documented, source: 'docs/configuration.md "Without it, a visitor can claim any address"'}
  - id: "passkey origin, OAuth discovery, external-login redirect"
    component: identity
    parameters:
      - name: "X-Forwarded-Host, X-Forwarded-Proto"
        attacker_controllable: true
        x-condition: "honoured for served hosts or from trusted proxies"
        control_kinds: [resource-name]
        obligation_id: trust-proxy-headers-behind-proxy
        caller_must_enforce: "TRUST_PROXY_HEADERS only behind a real proxy"
        provenance: {kind: documented, source: 'docs/authentication.md "anyone could choose the address"'}
  - id: "POST /auth/login, /iiif/auth/access form"
    component: identity
    parameters:
      - name: "email, password"
        attacker_controllable: true
        control_kinds: [data, size, rate]
        caller_must_enforce: "none — P-PASSWORDS-OFF (passwords work only where auth.passwords is on)"
        provenance: {kind: documented, source: 'docs/authentication.md "With passwords off, password sign-in"'}
  - id: "/auth/setup, /auth/passkey/setup*, /auth/setup/no-passkey"
