  - {id: N-DOWNLOADS, components: [optional], tier: security-critical, false_friend: false, conditions: "integrity beyond HTTPS and the publisher for llama.cpp, cloudflared, pip installs and hf: models; catalog GGUF files are still checked (P-MODEL-CHECKSUM)", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: N-DB-PLAIN, components: [outbound], tier: security-critical, false_friend: true, conditions: "encryption of the SurrealDB content (transcripts, indexes), derived files, renditions, reports, exports and the storage-source cache; stated limit", x-false-friend-note: "vaults cover files only", provenance: {kind: documented, source: 'docs/encryption.md "the SurrealDB database itself"'}}
  - {id: N-KEY-WITH-DATA, components: [outbound], tier: security-critical, false_friend: true, conditions: "key separation; unless ARCHIVE_SECRET_KEY comes from outside, secret.key lives in data_dir next to the sealed rows and the backups; a copy of data_dir opens sealed secrets and server-wrapped file keys", x-false-friend-note: "'stored encrypted' reads as safe in a stolen backup", provenance: {kind: inferred, question_id: Q14}}
  - {id: N-SIGNED-BEARER, components: [authz], tier: security-critical, false_friend: true, conditions: "identity binding or early revocation for signed links; a link opens its path for whoever holds it until it expires (6 h; IIIF 1 h); path, expiry and full are bound, extra query parameters are not; which fields get signed is P-MEDIA-LINK", x-false-friend-note: "a signed link is a capability, not a login", provenance: {kind: documented, source: 'core/security.py sign_path docstring "grants read access to exactly this path until it expires"'}}
  - {id: N-LINK-AFTER-ROLE, components: [authz], tier: security-critical, false_friend: false, conditions: "re-checks of share links and report links against the creator's current role; share links last until expiry or revocation", provenance: {kind: inferred, question_id: Q10}}
  - {id: N-IDS, components: [authz], tier: correctness-only, false_friend: true, conditions: "secret identifiers; recording and entity ids are sequential and authorization never relies on them; short share codes are about 58 bits; a route that relied on id secrecy breaks P-NS-ISOLATION instead", x-false-friend-note: "unguessable-looking ids are not authorization", provenance: {kind: inferred, question_id: Q6}}
  - {id: N-APP-LAYER, components: [authz], tier: security-critical, false_friend: true, conditions: "database-enforced tenant isolation; every namespace is rows in one SurrealDB database under one credential; anyone with the DB credential or a worker host sees all namespaces", x-false-friend-note: "namespaces are not DB namespaces", provenance: {kind: inferred, question_id: Q9}}
  - {id: N-XFF, components: [authz], tier: security-critical, false_friend: true, conditions: "trust in visitor addresses without a correct proxy chain; covers proxy chains the operator builds; the compose files' own chain is claimed (P-IPGROUP, P-THROTTLE); other shipped variants are Q2", x-false-friend-note: "IP groups are not authentication", provenance: {kind: documented, source: 'docs/configuration.md "Without it, a visitor can claim any address"'}}
  - {id: N-WEBGATE, components: [web], tier: correctness-only, false_friend: true, conditions: "authorization in the web app; proxy.ts redirects pages, the API decides; /api, /mcp, /iiif, /embed, /s bypass the page gate", provenance: {kind: inferred, question_id: Q8}}
  - {id: N-HOST, components: [web], tier: correctness-only, false_friend: true, conditions: "authentication from the Host allowlist; it stops DNS rebinding only; every request; * turns the check off", provenance: {kind: documented, source: 'docs/configuration.md "stops DNS rebinding"'}}
  - {id: N-CSRF, components: [identity], tier: security-critical, false_friend: false, conditions: "anti-CSRF tokens on the API; a cross-site request carries no credential because the API takes bearer tokens only (P-BEARER-ONLY); /api/v1 only; the IIIF cookie flow (Q1) and NextAuth handlers are not covered; stated mechanism, not silence", provenance: {kind: documented, source: 'docs/architecture.md "so there is no CSRF surface"'}}
  - {id: N-HEADERS, components: [web], tier: correctness-only, false_friend: false, conditions: "hardening headers as findings without an attack; headers no §1.11 property names (for example HSTS outside Cloudflare, a full CSP on web app pages); excludes P-FRAME, P-HARDENED, P-OAUTH's consent page and P-HOST; a missing header with a working attack is judged on that attack", provenance: {kind: documented, source: 'SECURITY.md "missing hardening headers with no"'}}
  - {id: N-VOLUME, components: [web, authz, optional], tier: correctness-only, false_friend: false, conditions: "protection against denial of service by volume: rate limits on read APIs, connection counts on the MQTT and syslog listeners, an uncapped offset on the REST list routes; size caps and budgets §1.11 states (P-OAUTH, P-UPLOAD, P-QUERY, P-RETRIEVAL) are claimed, not covered here; does not cover /mcp tool arguments (unresolved, Q47)", provenance: {kind: documented, source: 'SECURITY.md "denial of service by sheer volume"'}}
  - {id: N-BUDGET, components: [assistant], tier: correctness-only, false_friend: true, conditions: "hard cost caps; budgets are pre-run estimates and off by default; model and pipeline cost, not request volume", x-false-friend-note: "budgets are not DoS protection", provenance: {kind: documented, source: 'docs/budgets.md "Budgets are off unless an admin sets one"'}}
  - {id: N-THROTTLE-SCOPE, components: [identity], tier: correctness-only, false_friend: false, conditions: "throttles beyond the documented sign-in flows, or across processes and restarts: unauthenticated refresh, ticket, forgot, OAuth token routes and share-code guessing; setup routes are not covered (Q42)", provenance: {kind: inferred, question_id: Q5}}
  - {id: N-REVOKE-TOKENS, components: [identity], tier: security-critical, false_friend: false, conditions: "revocation of API tokens, app grants and IIIF cookies on password change, reset or passkey removal; disabling the account, or revoking the grant, still stops them", provenance: {kind: inferred, question_id: Q3}}
  - {id: N-OIDC, components: [identity], tier: security-critical, false_friend: false, conditions: "ID-token or nonce checks; Lens reads identity from the provider's token and userinfo endpoints over TLS; the external flow's state, PKCE and browser cookie still bind the callback (P-ONCE); stated mechanism, not silence", provenance: {kind: documented, source: 'docs/authentication.md "token and userinfo endpoints"'}}
  - {id: N-PROVIDER, components: [identity], tier: security-critical, false_friend: false, conditions: "protection from a provider that vouches falsely for an email; admin-chosen providers; Microsoft common tenant is not trusted for email", provenance: {kind: documented, source: 'docs/authentication.md "when the provider vouches for the email"'}}
  - {id: N-LOG-SETUP, components: [identity], tier: security-critical, false_friend: false, conditions: "secrecy of the setup code and logged sign-in links from log readers, until the first admin exists, and links when mail is not set; stored credentials are not covered (P-SECRETS, Q32)", provenance: {kind: documented, source: 'docs/authentication.md "the API prints in its log"'}}
  - {id: N-HTTP-SETUP, components: [identity], tier: security-critical, false_friend: false, conditions: "passkey protection on plain HTTP; there the code alone makes the admin and a link alone signs in; plain HTTP is supported on one machine only", provenance: {kind: documented, source: 'docs/authentication.md "the code alone makes the admin"'}}
  - {id: N-OAUTH-CLIENT, components: [identity], tier: correctness-only, false_friend: false, conditions: "checking the app's state or guarding its redirect after the code arrives; registration is open, consent is the gate; the app's side only; Lens's redirect-URI, PKCE and consent checks are P-OAUTH", provenance: {kind: documented, source: 'docs/authentication.md "Apps register themselves"'}}
  - {id: N-CHROMIUM, components: [outbound, ingest], tier: security-critical, false_friend: true, conditions: "Chromium's own sandbox in containers or as root; the netguard proxy is what stops a page; conversion and capture", x-false-friend-note: "'headless browser' is not isolation", provenance: {kind: documented, source: 'docs/deployment.md "what stops a page is Lens''s proxy"'}}
  - {id: N-DECODERS, components: [ingest], tier: security-critical, false_friend: false, conditions: "sandboxing or memory-safety for ffmpeg, poppler, antiword and similar decoders; memory bugs inside them route to §1.9; does not cover Lens's own process control (timeouts, killing children): that is P-CONVERT-TIMEOUT", provenance: {kind: inferred, question_id: Q20}}
  - {id: N-BOMBS, components: [ingest], tier: security-critical, false_friend: false, conditions: "bounds on decompressed size, nested emails or media duration (docx XML, email attachments, long media); does not cover a conversion or capture outliving Lens's own timeout (P-CONVERT-TIMEOUT)", provenance: {kind: inferred, question_id: Q22}}
  - {id: N-PROMPT, components: [assistant], tier: correctness-only, false_friend: true, conditions: "resistance to prompt injection from transcripts, documents, OCR, web pages or tool replies; impact on words and notes only; crossing the person's reads, approvals or role is P-RETRIEVAL or P-APPROVAL; exfiltration through rendered answers is Q26", x-false-friend-note: "a system prompt is not a filter", provenance: {kind: inferred, question_id: Q26}}
  - {id: N-MODEL-OUTPUT, components: [assistant], tier: correctness-only, false_friend: false, conditions: "correct or grounded model output; answers can be wrong; checking sources re-asks the same model", provenance: {kind: documented, source: 'docs/assistant.md "Check sources"'}}
  - {id: N-REMOTE, components: [outbound], tier: security-critical, false_friend: false, conditions: "trust in remote content (storage listings, mail, calendars, IIIF manifests, model replies), treated as data; does not cover Lens's own cache keys or names for remote content (P-REMOTE-NAMES, Q43)", provenance: {kind: inferred, question_id: Q17}}
  - {id: N-ADMIN-IMPORT-BOUNDS, components: [outbound, query], tier: security-critical, false_friend: false, conditions: "resource bounds on admin-started imports and syncs, and SPARQL time; IIIF media up to 4 GB in memory; rclone without byte cap", provenance: {kind: inferred, question_id: Q16}}
  - {id: N-ATOMIC, components: [authz, ingest], tier: correctness-only, false_friend: false, conditions: "all-or-nothing moves, merges, graph undo, RDF import; exactly-once job steps; delete commits DB rows atomically, files after; partial state never widens access, and if it does, P-NS-ISOLATION applies", provenance: {kind: inferred, question_id: Q12}}
  - {id: N-CHAT-HISTORY, components: [assistant], tier: correctness-only, false_friend: false, conditions: "re-filtering saved assistant answers after access is lost (only cited passages are filtered); text the same person already saw in their own saved chats, nothing new", provenance: {kind: inferred, question_id: Q11}}
  - {id: N-ENUM, components: [identity], tier: correctness-only, false_friend: false, conditions: "hiding account or object existence outside password sign-in and signed-in 404s: passkey 404, external messages, anonymous 401 vs 404", provenance: {kind: inferred, question_id: Q6}}
  - {id: N-AUDIT, components: [identity, authz], tier: correctness-only, false_friend: false, conditions: "tamper evidence or completeness of the audit and activity logs; sign-in requests are not logged there; operations record only; admins read it", provenance: {kind: documented, source: 'docs/activity.md "aren''t logged here"'}}
  - {id: N-MQTT-SUBSCRIBE, components: [optional], tier: security-critical, false_friend: true, conditions: "topic isolation on the MQTT hub: anything can subscribe to it, with + and #; signed-in or anonymous-when-enabled clients", x-false-friend-note: "a hub login is not per-stream access", provenance: {kind: documented, source: 'docs/sensors.md "anything can subscribe to it"'}}
  - {id: N-BRIDGE, components: [outbound], tier: security-critical, false_friend: false, conditions: "per-person access in chat rooms; the bridge answers as one account, the turning-on admin by default; everyone in the room reads what that account reads (exposure posture: Q28)", provenance: {kind: documented, source: 'docs/chat-rooms.md "answers as the admin who turned it on"'}}
  - {id: N-PUBLIC, components: [authz], tier: correctness-only, false_friend: false, conditions: "privacy of a public recording's open parts: anyone may use them; open parts only; closed parts and restricted or private recordings are P-ACCESS-PARTS", provenance: {kind: documented, source: 'docs/access.md "the parts of a public recording anyone may use"'}}
  - {id: N-DESCRIPTION, components: [authz], tier: correctness-only, false_friend: false, conditions: "hiding a recording's description when its parts are closed; anyone who may see the page", provenance: {kind: documented, source: 'docs/access.md "never a closed part"'}}
  - {id: N-RDF-XML, components: [query], tier: security-critical, false_friend: false, conditions: "XML parsing in RDF import; RDF/XML is refused, so XXE and billion-laughs do not apply there; RDF import only, not docx", provenance: {kind: documented, source: 'rdf_import.py docstring "RDF/XML isn''t read"'}}

x-false-friends-without-row:
  - "a read-scope token still reads everything its person can read; 'read' does not mean 'public'"

# ---------------------------------------------------------------- §1.13
downstream_responsibilities:
  - {id: dr-https-secure-cookies, component: web, statement: "Put everything behind HTTPS before exposing it beyond one machine, and set server.secure_cookies: true there", enforces: [P-AUTH-REQ, P-SETUP-ONCE], x-protects: "sessions, setup, IIIF cookie (§1.6 plain HTTP)", provenance: {kind: documented, source: 'docs/configuration.md "Put everything behind HTTPS"'}}
  - {id: dr-prod-compose-unique-secrets, component: web, statement: "Use docker-compose.prod.yml or an installer, never dev compose, and set unique secrets", enforces: [P-AUTH-REQ, P-MEDIA-LINK], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: dr-change-db-credential, component: authz, statement: "Change the SurrealDB credential when SurrealDB runs as its own server", enforces: [N-APP-LAYER], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: dr-reverse-proxy-xff, component: authz, statement: "Outside the compose files, put a reverse proxy in front of the web app that sets X-Forwarded-For", enforces: [P-IPGROUP, P-THROTTLE, trusted-proxy-chain], provenance: {kind: documented, source: 'docs/configuration.md "Put a reverse proxy in front of the web app"'}}
  - {id: dr-list-front-hops, component: authz, statement: "List exactly the front hops in server.trusted_proxies or LENS_TRUSTED_PROXY_HOSTS", enforces: [P-IPGROUP, trusted-proxy-chain], provenance: {kind: documented, source: 'docs/configuration.md "Trusted proxies"'}}
  - {id: dr-trust-proxy-headers, component: identity, statement: "Enable TRUST_PROXY_HEADERS only behind a proxy that sets X-Forwarded-Host", enforces: [trust-proxy-headers-behind-proxy], x-protects: "OAuth discovery, passkey origin", provenance: {kind: documented, source: 'docs/authentication.md "anyone could choose the address"'}}
  - {id: dr-allowed-hosts, component: web, statement: "List served hosts in server.allowed_hosts; never * on an exposed host", enforces: [P-HOST, list-served-hosts], provenance: {kind: documented, source: 'docs/configuration.md "stops DNS rebinding"'}}
  - {id: dr-iiif-allowed-origins, component: authz, statement: "Set iiif.allowed_origins to trusted viewer sites", enforces: [set-iiif-allowed-origins], x-protects: "IIIF tokens (Q1)", provenance: {kind: inferred, question_id: Q1}}
  - {id: dr-stable-secrets, component: outbound, statement: "Keep ACCESS_SECRET_KEY and ARCHIVE_SECRET_KEY stable and backed up; rotate ACCESS_SECRET_KEY to cut every outstanding signed link", enforces: [P-SECRETS, P-ENCRYPTION, N-SIGNED-BEARER, MX-OUTBOUND-KEY-ROTATION], x-protects: "sign-in, stored credentials, encrypted files, N-SIGNED-BEARER", provenance: {kind: documented, source: 'docs/deployment.md "Stable secrets"'}}
  - {id: dr-key-backup-separate, component: outbound, statement: "Back up the key separately from the data; prefer ARCHIVE_SECRET_KEY from outside the volume; protect backups like the data", enforces: [N-KEY-WITH-DATA], provenance: {kind: documented, source: 'docs/encryption.md "backed up separately"'}}
  - {id: dr-encrypted-disk, component: outbound, statement: "Put the data volume on an encrypted disk", enforces: [N-DB-PLAIN], provenance: {kind: documented, source: 'docs/encryption.md "the SurrealDB database itself"'}}
  - {id: dr-log-secret-until-admin, component: identity, statement: "Treat the server log as secret until the first admin exists, and while mail is unset", enforces: [N-LOG-SETUP, private-log-until-first-admin], provenance: {kind: documented, source: 'docs/authentication.md "the API prints in its log"'}}
  - {id: dr-trusted-admins-only, component: assistant, statement: "Make only fully trusted people admins", enforces: [N-ADMIN, P-NO-CODE], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: dr-verified-email-providers, component: identity, statement: "Choose identity providers that verify emails", enforces: [N-PROVIDER, admin-chooses-providers], provenance: {kind: documented, source: 'docs/authentication.md "when the provider vouches for the email"'}}
  - {id: dr-revoke-after-password-change, component: identity, statement: "After a password change or suspected theft, revoke API tokens and app grants, or disable the account", enforces: [N-REVOKE-TOKENS], provenance: {kind: inferred, question_id: Q3}}
  - {id: dr-private-networks-on-purpose, component: outbound, statement: "List private networks in documents.web_networks or notifications.networks only on purpose", enforces: [P-SSRF-GUARD, P-ADMIN-GUARD], provenance: {kind: documented, source: 'docs/configuration.md "loopback and cloud metadata addresses stay out"'}}
  - {id: dr-firewall-sensor-ports, component: optional, statement: "When sensors are on, firewall ports 1883 and 5514 or bind them to a private address", enforces: [P-SENSORS, N-MQTT-SUBSCRIBE, enable-and-firewall-sensors], provenance: {kind: documented, source: 'docs/sensors.md "Ways in"'}}
  - {id: dr-bridge-own-account, component: outbound, statement: "Give the chat-room bridge its own low-role account", enforces: [N-BRIDGE], provenance: {kind: documented, source: 'docs/chat-rooms.md "it reads only what that account can read"'}}
  - {id: dr-trusted-worker-hosts, component: authz, statement: "Run workers only on trusted hosts; they hold the DB credential", enforces: [N-APP-LAYER, trusted-peer-hosts], provenance: {kind: inferred, question_id: Q9}}
  - {id: dr-trusted-model-servers, component: assistant, statement: "Pick model and speech servers you trust with transcripts and audio", enforces: [], x-protects: "§1.8 prompts", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: dr-chromium-sandbox, component: ingest, statement: "Run conversion where Chromium can keep its sandbox (non-root, user namespaces)", enforces: [N-CHROMIUM], provenance: {kind: documented, source: 'docs/configuration.md "runs with its sandbox where it can"'}}
  - {id: dr-trusted-extensions-only, component: assistant, statement: "Enable another person's extension only when you trust its author", enforces: [N-PROMPT, enable-only-trusted-extensions], x-protects: "N-PROMPT, §1.14", provenance: {kind: inferred, question_id: Q27}}
  - {id: dr-escape-exports, component: authz, statement: "Escape exported text, RDF, IIIF metadata and assistant output for your own sink", enforces: [dmna-export-escaping, dmna-api-text-safe-for-sinks, dmna-assistant-grounded], x-protects: "§1.8", provenance: {kind: inferred, question_id: Q24}}
  - {id: dr-untrusted-prompt-input, component: assistant, statement: "Treat transcript text and MCP results as untrusted prompt input in your agents", enforces: [N-PROMPT, dmna-mcp-text-as-instructions], provenance: {kind: inferred, question_id: Q26}}
  - {id: dr-iiif-over-https, component: authz, statement: "Keep the IIIF cookie SameSite=None; Secure by serving IIIF over HTTPS", enforces: [], x-protects: "IIIF cookie", provenance: {kind: documented, source: 'docs/iiif.md "its cookie is `SameSite=None; Secure`"'}}
  - {id: dr-verify-webhook-signature, component: outbound, statement: "Verify webhook-signature on receipt; treat Slack and Discord target URLs as secrets", enforces: [dmna-chat-webhooks-signed], x-protects: "§1.8 webhook bodies", provenance: {kind: documented, source: 'domain/notify.py docstring "signed the Standard Webhooks way"'}}
  - {id: dr-private-logs-push-tokens, component: optional, statement: "Keep logs that record request paths private when sensor push tokens are in use", enforces: [P-SENSORS], provenance: {kind: documented, source: 'docs/sensors.md "Ways in"'}}

# ---------------------------------------------------------------- §1.14
# §1.14 rows carry no inline tag. Each record's provenance is taken from the
# tagged prose statement elsewhere in the model that grounds the same misuse
# (named in x-provenance-basis); none is stronger than that statement.
known_misuses:
  - {id: km-dev-compose-on-server, components: [web], pattern: "Running docker-compose.yml on a server", x-why-unsafe: "Known secrets forge media links and session cookies", safer_alternative: "Use docker-compose.prod.yml or an installer", x-provenance-basis: "§1.13 row 'Use docker-compose.prod.yml or an installer'; §1.6 dev compose row", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: km-env-example-secret, components: [identity, authz], pattern: "Copying .env.example without changing ACCESS_SECRET_KEY", x-why-unsafe: "The example passes the length check and is public", safer_alternative: "Generate a random key", x-provenance-basis: "§1.13 row 'set unique secrets'", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: km-broad-trusted-proxies, components: [authz], pattern: "Broad server.trusted_proxies (for example a whole LAN)", x-why-unsafe: "Any host in it can claim any visitor address and open IP groups", safer_alternative: "List only the proxy hops", x-provenance-basis: "§1.13 row 'List exactly the front hops'", provenance: {kind: documented, source: 'docs/configuration.md "Trusted proxies"'}}
  - {id: km-ip-group-without-proxy, components: [authz], pattern: "An IP group for everything with no reverse proxy outside compose", x-why-unsafe: "Visitors choose their own address", safer_alternative: "Add a proxy that sets X-Forwarded-For", x-provenance-basis: "§1.12 N-XFF", provenance: {kind: documented, source: 'docs/configuration.md "Without it, a visitor can claim any address"'}}
  - {id: km-pasting-signed-links, components: [authz], pattern: "Pasting signed media links into chats or tickets", x-why-unsafe: "Anyone with the link opens the media until it expires", safer_alternative: "Share a revocable share link instead", x-provenance-basis: "§1.12 N-SIGNED-BEARER", provenance: {kind: documented, source: 'core/security.py sign_path docstring "grants read access to exactly this path until it expires"'}}
  - {id: km-enable-unread-extension, components: [assistant], pattern: "Enabling a teammate's shared extension without reading it", x-why-unsafe: "Its http tool can send your readable data to its author's host", safer_alternative: "Enable only extensions you trust (Q27)", x-provenance-basis: "§1.13 row 'Enable another person's extension only when you trust its author' (Q27)", provenance: {kind: inferred, question_id: Q27}}
  - {id: km-bridge-without-account, components: [outbound], pattern: "Turning on the chat-room bridge without its own account", x-why-unsafe: "The room reads as the admin", safer_alternative: "Give the bridge a low-role account", x-provenance-basis: "§1.12 N-BRIDGE", provenance: {kind: documented, source: 'docs/chat-rooms.md "answers as the admin who turned it on"'}}
  - {id: km-admin-for-python-tool, components: [assistant], pattern: "Making someone admin so they can write a Python tool", x-why-unsafe: "Admin equals host code execution", safer_alternative: "Use prompt, graph or http tools", x-provenance-basis: "§1.2 roles and trust; §1.13 'Make only fully trusted people admins'", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: km-wide-web-networks, components: [outbound], pattern: "Wide LENS_WEB_NETWORKS", x-why-unsafe: "Editors, and iCal feed redirects, can then reach those networks", safer_alternative: "List single hosts", x-provenance-basis: "§1.6 web_networks row; §1.13 private networks row", provenance: {kind: documented, source: 'docs/configuration.md "loopback and cloud metadata addresses stay out"'}}
  - {id: km-push-token-in-url, components: [optional], pattern: "Webhook push token in a URL that proxies log", x-why-unsafe: "The token is a credential in the path", safer_alternative: "Use the header form", x-provenance-basis: "§1.13 row 'Keep logs that record request paths private'", provenance: {kind: documented, source: 'docs/sensors.md "Ways in"'}}
  - {id: km-hosted-model-sensitive, components: [assistant], pattern: "Pointing the assistant at a hosted model for sensitive archives", x-why-unsafe: "Transcripts leave the machine", safer_alternative: "Use a local model server", x-provenance-basis: "§1.13 row 'Pick model and speech servers you trust'", provenance: {kind: maintainer, date: "2026-10"}}

# ---------------------------------------------------------------- §1.15
known_non_findings:
  - id: KNF-SIGNED-LINK
    components: [authz]
    x-sink: "media, report, IIIF links"
    symptom: "info-leak to a link holder"
    tool_pattern: "A signed link works without a session, or after sign-out or role loss"
    conditions: "The server issued the link through an allow-listed field (media.LINK_KEYS), to a principal who could read that path when it was issued, and it is within its expiry. A link minted from text people or models wrote is P-MEDIA-LINK, not this entry"
    discharged_by: [N-SIGNED-BEARER]
    provenance: {kind: documented, source: 'core/security.py sign_path docstring "grants read access to exactly this path until it expires"'}
  - id: KNF-DESCRIPTION
    components: [authz]
    x-sink: "IIIF manifests, public pages"
    symptom: "info-leak of description"
    tool_pattern: "A recording's description shows while its parts are closed"
    conditions: "The field is the description, shown to someone who may see the page"
    discharged_by: [N-DESCRIPTION]
    provenance: {kind: documented, source: 'docs/access.md "never a closed part"'}
  - id: KNF-MQTT-WILDCARD
    components: [optional]
    x-sink: "MQTT hub"
    symptom: "info-leak between devices"
    tool_pattern: "A logged-in device subscribes to # and reads other streams"
    conditions: "Sensors on; the client holds a hub login or anonymous mode is on"
    discharged_by: [N-MQTT-SUBSCRIBE]
    provenance: {kind: documented, source: 'docs/sensors.md "anything can subscribe to it"'}
  - id: KNF-NO-SANDBOX
    components: [ingest]
    x-sink: "Chromium conversion and capture"
    symptom: "missing sandbox flag"
    tool_pattern: "Chromium starts with --no-sandbox"
    conditions: "Running as root or without user namespaces; the netguard proxy is in the path"
