# ---------------------------------------------------------------- §1.2 / §1.3 / §1.4
components:
  - name: web
    scope: in
    x-family: "Web app & API gateway (Web)"
    reachability_precondition: "reachable from a browser request and changes what the API decides or what another person's browser runs"
    provenance: {kind: inferred, question_id: Q34}
  - name: identity
    scope: in
    x-family: "Identity & sessions (Identity)"
    reachability_precondition: "reachable with no account, or with an account, and yields a session, token or admin the attacker was not given; setup-code findings apply only while no account exists"
    provenance: {kind: documented, source: 'docs/authentication.md "one-time **setup code**"'}
  - name: authz
    scope: in
    x-family: "Authorization & data API (AuthZ)"
    reachability_precondition: "lets a principal read or change more than its role and the recording's access level allow, or open media without a link the server signed for it"
    provenance: {kind: documented, source: 'SECURITY.md "What counts"'}
  - name: outbound
    scope: in
    x-family: "Outbound fetchers & stored secrets (Outbound)"
    reachability_precondition: "a URL a non-admin sets, or a guarded admin operand, reaches a non-public address; or a stored secret reaches anyone but the host the admin set"
    provenance: {kind: maintainer, date: "2026-10"}
  - name: ingest
    scope: in
    x-family: "Ingest & processing (Ingest)"
    reachability_precondition: "reachable from bytes an editor uploads or a watched source delivers, and the fault is in how Lens runs the tool (arguments, environment, timeouts, sandbox flags)"
    provenance: {kind: inferred, question_id: Q34}
  - name: query
    scope: in
    x-family: "Query engines (Query)"
    reachability_precondition: "query text from a non-admin reads outside the caller's namespaces, writes, fetches, or reaches SurrealQL"
    provenance: {kind: inferred, question_id: Q34}
  - name: assistant
    scope: in
    x-family: "Assistant & extensions (Assistant)"
    reachability_precondition: "a non-admin (or content steering the model for one) exceeds the person's reads, changes data without approval outside notes and admin setup, or runs code on the host"
    provenance: {kind: inferred, question_id: Q34}
  - name: optional
    scope: in
    x-family: "Optional services, off by default (Optional)"
    reachability_precondition: "the service is turned on by an admin, and the attacker lacks the login, network or token the feature requires"
    provenance: {kind: inferred, question_id: Q34}
  - name: ci-tooling-and-samples
    scope: out
    reason: "examples/ (source clone only), overrides/ (mkdocs theme), ci/, .github/, .pre-commit* (CI, in no image) and prod-frontend-deploy.yml (stale Vercel workflow) are unsupported paths built into no running service (§1.3)"
    provenance: {kind: assumption, question_id: Q34}
  - name: inert-backend-files
    scope: out
    reason: "fastapi_backend/tests/, watcher.py and commands/ are copied into the backend image but never started by the production command; a report must show production code reaching them (§1.3)"
    provenance: {kind: assumption, question_id: Q34}

