# ---------------------------------------------------------------- §1.8
outputs:
  - component: authz
    channel: "JSON API responses (titles, transcripts, notes, metadata)"
    taint: same-as-input
    x-taint-note: "as typed by people or produced by ASR/OCR; search snippet is HTML-escaped with <mark>"
    taint_provenance: {kind: documented, source: 'docs/api.md "an HTML-escaped `snippet`"'}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-api-text-safe-for-sinks, statement: "that any text field is safe for HTML, Markdown, SQL or a shell", provenance: {kind: documented, source: 'docs/api.md "an HTML-escaped `snippet`"'}}
  - component: authz
    channel: "Signed links in responses (api/media.py)"
    taint: constrained
    taint_provenance: {kind: documented, source: 'docs/architecture.md "is never signed"'}
    invariants:
      - {id: inv-signed-links-allow-listed, statement: "server-written for allow-listed fields only; text that looks like a link is never signed", property_id: P-MEDIA-LINK, provenance: {kind: documented, source: 'docs/architecture.md "is never signed"'}}
    downstream_must_not_assume:
      - {id: dmna-signed-link-private, statement: "that a link is private: it is a bearer credential until expiry", provenance: {kind: documented, source: 'docs/architecture.md "is never signed"'}}
  - component: authz
    channel: "Exports, RDF, JSON-LD, IIIF manifests, WebVTT, Dublin Core"
    taint: same-as-input
    x-taint-note: "values as typed; RDF responses send Access-Control-Allow-Origin: *"
    taint_provenance: {kind: inferred, question_id: Q24}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-export-escaping, statement: "escaping for the consumer's format", provenance: {kind: inferred, question_id: Q24}}
  - component: authz
    channel: "Recording description (IIIF, public pages)"
    taint: same-as-input
    x-taint-note: "never a closed part; anyone who may see the page sees it"
    taint_provenance: {kind: documented, source: 'docs/access.md "never a closed part"'}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-closed-parts-hide-description, statement: "that closing parts hides the description", provenance: {kind: documented, source: 'docs/access.md "never a closed part"'}}
  - component: authz
    channel: "Embed player and /s/<code> pages (api/pages.py)"
    taint: same-as-input
    x-taint-note: "HTML built from DB values under a strict CSP; framable only per server.embed_frame_ancestors"
    taint_provenance: {kind: documented, source: 'docs/configuration.md "Content-Security-Policy"'}
    invariants:
      - {id: inv-embed-frame-policy, statement: "framable only per server.embed_frame_ancestors, under a strict CSP", property_id: P-FRAME, provenance: {kind: documented, source: 'docs/configuration.md "Content-Security-Policy"'}}
    downstream_must_not_assume:
      - {id: dmna-titles-inert, statement: "that titles are inert outside this page", provenance: {kind: documented, source: 'docs/configuration.md "Content-Security-Policy"'}}
  - component: authz
    channel: "Report pages (api/pages.py)"
    taint: same-as-input
    x-taint-note: "links re-signed on read for every recording of the namespace in the page"
    taint_provenance: {kind: inferred, question_id: Q10}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-report-link-scope, statement: "that a report link opens only the report", provenance: {kind: inferred, question_id: Q10}}
  - component: assistant
    channel: "Assistant answers, summaries, LLM-written notes"
    taint: same-as-input
    x-taint-note: "model output over untrusted content"
    taint_provenance: {kind: inferred, question_id: Q26}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-assistant-grounded, statement: "that it is grounded or free of injected instructions", provenance: {kind: inferred, question_id: Q26}}
  - component: authz
    channel: "MCP tool results (api/mcp_tools.py)"
    taint: same-as-input
    x-taint-note: "the person's readable data, as text"
    taint_provenance: {kind: documented, source: 'docs/mcp.md "sees exactly what that person sees"'}
    invariants:
      - {id: inv-mcp-person-reads, statement: "results contain only what the person can read", property_id: P-RETRIEVAL, provenance: {kind: documented, source: 'docs/mcp.md "sees exactly what that person sees"'}}
    downstream_must_not_assume:
      - {id: dmna-mcp-text-as-instructions, statement: "that transcript text is safe to follow as instructions", provenance: {kind: documented, source: 'docs/mcp.md "sees exactly what that person sees"'}}
  - component: outbound
    channel: "Error text from remote servers (LLM, speech, rclone, IMAP callers)"
    taint: same-as-input
    x-taint-note: "up to 300 characters of the remote reply and the URL as typed"
    taint_provenance: {kind: inferred, question_id: Q18}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-internal-hosts-hidden, statement: "that internal host names stay hidden", provenance: {kind: inferred, question_id: Q18}}
  - component: outbound
    channel: "Webhook bodies (notify.py)"
    taint: same-as-input
    x-taint-note: "event data, HMAC-signed for the webhook kind only"
    taint_provenance: {kind: documented, source: 'domain/notify.py docstring "signed the Standard Webhooks way"'}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-chat-webhooks-signed, statement: "that Slack or Discord messages are signed", provenance: {kind: documented, source: 'domain/notify.py docstring "signed the Standard Webhooks way"'}}
  - component: outbound
    channel: "Fedora export (fedora.py)"
    taint: same-as-input
    x-taint-note: "every namespace's metadata and files"
    taint_provenance: {kind: documented, source: 'domain/fedora.py docstring "every namespace, collection, recording"'}
    invariants: []
    downstream_must_not_assume:
      - {id: dmna-fedora-one-namespace, statement: "that the Fedora account is limited to one namespace", provenance: {kind: documented, source: 'domain/fedora.py docstring "every namespace, collection, recording"'}}
  - component: outbound
    channel: "Telemetry (telemetry.py)"
    taint: constrained
    x-taint-note: "route templates, ids, counts; never content"
    taint_provenance: {kind: documented, source: 'docs/telemetry.md "Never sent"'}
    invariants:
      - {id: inv-telemetry-no-content, statement: "never sends content, names, addresses or error messages", property_id: P-TELEMETRY, provenance: {kind: documented, source: 'docs/telemetry.md "Never sent"'}}
    downstream_must_not_assume:
      - {id: dmna-collector-private, statement: "that the operator's collector is private", provenance: {kind: documented, source: 'docs/telemetry.md "Never sent"'}}
  - component: identity
    channel: "Server log (API)"
