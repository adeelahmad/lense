# ---------------------------------------------------------------- §1.7 contract-dimension matrix
# Every in-scope component × the eight required dimensions appears exactly once.
# Prose sub-rows that refine a standard dimension (for example "Numeric domain:
# absolute session cap") are carried as x- dimensions so each standard cell
# stays unique. `x-routes-to` keeps the prose "Routes to" cell when it names
# more than the single property_id.
contract_dimensions:
  # --- Web
  - {component: web, dimension: numeric-domain, status: not-applicable, conditions: "bodies pass through; size caps are the API's", x-routes-to: "§1.7 rows", provenance: {kind: documented, source: 'backend-proxy.ts docstring "Serves the FastAPI backend''s paths on this origin"'}}
  - {component: web, dimension: failure-atomicity, status: not-applicable, conditions: "no server state; only the encrypted session cookie", x-routes-to: "P-AUTH-REQ", provenance: {kind: documented, source: 'docs/configuration.md "encrypts the NextAuth session cookie"'}}
  - {component: web, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "stateless proxy, no recursive input; forwards bytes", provenance: {kind: inferred, question_id: Q34}}
  - {component: web, dimension: concurrency-reentrancy, status: not-applicable, conditions: "stateless proxy; no shared mutable state", provenance: {kind: inferred, question_id: Q34}}
  - {component: web, dimension: callback-execution, status: unresolved, conditions: "the API authorizes every call; proxy.ts only redirects pages", x-routes-to: "N-WEBGATE", question_id: Q8, provenance: {kind: inferred, question_id: Q8}}
  - {component: web, dimension: serialization-reconstruction, status: claimed, property_id: P-AUTH-REQ, conditions: "session cookie encrypted with AUTH_SECRET (dev secret voids it)", provenance: {kind: documented, source: 'docs/authentication.md "takes effect immediately"'}}
  - {component: web, dimension: reference-lifecycle, status: claimed, property_id: P-AUTH-REQ, conditions: "sign-out ends the session at once", provenance: {kind: documented, source: 'docs/authentication.md "takes effect immediately"'}}
  - {component: web, dimension: resource-complexity, status: disclaimed, property_id: N-VOLUME, conditions: "no rate limit beyond sign-in throttles", provenance: {kind: documented, source: 'SECURITY.md "denial of service by sheer volume"'}}
  - {component: web, dimension: x-browser-rendering, status: unresolved, conditions: "lower-role text rendered in another person's browser", question_id: Q24, provenance: {kind: inferred, question_id: Q24}}
  - {component: web, dimension: x-headers, status: claimed, property_id: P-HARDENED, conditions: "web app page headers and API framing as documented", x-routes-to: "P-HARDENED, P-FRAME; others N-HEADERS", provenance: {kind: documented, source: 'docs/deployment.md "What''s hardened already"'}}
  - {component: web, dimension: x-forwarded-host, status: unresolved, conditions: "which header chooses the address OAuth discovery, the passkey origin and external-login redirects name", question_id: Q38, provenance: {kind: inferred, question_id: Q38}}
  # --- Identity
  - {component: identity, dimension: numeric-domain, status: claimed, property_id: P-LIFETIMES, conditions: "token and link lifetimes and tokens.max_days", provenance: {kind: documented, source: 'docs/authentication.md "A link lasts three days"'}}
  - {component: identity, dimension: x-numeric-domain-absolute-session-cap, status: unresolved, conditions: "the 168 h window resets on every refresh", question_id: Q4, provenance: {kind: inferred, question_id: Q4}}
  - {component: identity, dimension: failure-atomicity, status: claimed, property_id: P-ONCE, conditions: "one-time secrets spent before use; a refused attempt spends nothing; one code makes one first admin", x-routes-to: "P-ONCE, P-SETUP-ONCE", provenance: {kind: documented, source: 'docs/authentication.md "works once"'}}
  - {component: identity, dimension: recursive-cyclic-topology, status: not-applicable, conditions: "flat credentials; no nested identity input", provenance: {kind: inferred, question_id: Q34}}
  - {component: identity, dimension: callback-execution, status: disclaimed, property_id: N-OIDC, conditions: "identity from the provider's token and userinfo endpoints", x-routes-to: "N-OIDC, N-PROVIDER", provenance: {kind: documented, source: 'docs/authentication.md "token and userinfo endpoints"'}}
