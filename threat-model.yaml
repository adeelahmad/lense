    conditions: "outbound connections only to configured sources, model servers, mail, notification and telemetry targets; telemetry off by default; no update check; components.auto (on by default) runs pip installs and fetches hashed model files; llama.cpp and cloudflared from GitHub 'latest' when those features are on; hf: models from Hugging Face"
