; Lens on Cloudron: every process logs to stdout, which is the app's log in the dashboard (and `cloudron logs`).
[supervisord]
nodaemon=true
user=root
logfile=/run/lens/supervisord.log
pidfile=/run/lens/supervisord.pid
childlogdir=/run/lens

[unix_http_server]
file=/run/lens/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/lens/supervisor.sock

[program:surrealdb]
priority=10
user=cloudron
command=/usr/local/bin/surreal start --log info --bind 127.0.0.1:8001 --user root --pass %(ENV_SURREAL_PASS)s surrealkv:/app/data/surreal/lens.db
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
priority=20
user=cloudron
directory=/app/code/backend
command=/bin/bash -c 'until surreal is-ready --endpoint http://127.0.0.1:8001 >/dev/null 2>&1; do sleep 1; done; exec fastapi run app/main.py --host 127.0.0.1 --port 8000 --proxy-headers'
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
priority=30
user=cloudron
directory=/app/code/backend
command=/bin/bash -c 'until surreal is-ready --endpoint http://127.0.0.1:8001 >/dev/null 2>&1; do sleep 1; done; exec lens worker'
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
priority=40
user=cloudron
directory=/app/code/frontend
command=/app/code/frontend/node_modules/.bin/next start --hostname 0.0.0.0 --port 3000
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:export-db]
priority=50
user=cloudron
command=/app/code/cloudron/export-db.sh
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
