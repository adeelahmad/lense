<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Lens</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      .bar .grow { flex: 1; }
      .bar button, .bar a.button { padding: 3px 8px; font-size: 12px; }
      a.button { border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: inherit; background: var(--field); }
      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #signin { padding: 12px; }
      #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
      .empty { color: var(--muted); margin: auto 0; text-align: center; }
      .msg { max-width: 100%; overflow-wrap: anywhere; }
      .msg.user { align-self: flex-end; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; white-space: pre-wrap; }
      .msg.assistant .body > :first-child { margin-top: 0; }
      .msg.assistant .body > :last-child { margin-bottom: 0; }
      .msg.assistant pre { overflow-x: auto; background: var(--field); padding: 6px 8px; border-radius: 6px; }
      .msg.assistant table { border-collapse: collapse; }
      .msg.assistant td, .msg.assistant th { border: 1px solid var(--line); padding: 2px 6px; }
      a.cite { font-size: 11px; text-decoration: none; vertical-align: super; }
      .steps { list-style: none; margin: 0 0 6px; padding: 0; font-size: 12px; color: var(--muted); }
      .steps li::before { content: "✓ "; color: var(--ok); }
      .steps li.running { color: var(--fg); }
      .steps li.running::before { content: "◌ "; color: var(--accent); }
      .steps li.bad::before { content: "✗ "; color: var(--bad); }
      .note { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
      .note.bad { color: var(--bad); }
      .thinking { font-size: 12px; color: var(--muted); }
      .approval { border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
      .approval p { margin: 0 0 6px; }
      .approval .row { flex-wrap: wrap; }
      .approval .detail { white-space: pre-wrap; background: var(--field); border-radius: 6px; padding: 4px 8px; max-height: 120px; overflow-y: auto; }
      .browser { display: flex; align-items: center; gap: 6px; margin: 0 10px 8px; font-size: 12px; }
      .browser input { margin: 0; }
      .browser .hint.bad { color: var(--bad); }
      #ask { display: flex; gap: 6px; align-items: flex-end; padding: 8px 10px 4px; border-top: 1px solid var(--line); }
      #q { flex: 1; resize: none; max-height: 160px; font-family: inherit; font-size: 13px; }
      .keys { margin: 0 10px 8px; }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1><img src="icons/icon-32.png" alt="" /> Ask Lens</h1>
      <span class="grow"></span>
      <button id="new" type="button" title="Start a new conversation" hidden>New</button>
      <a id="open" class="button" target="_blank" rel="noopener" title="Open this conversation in Lens" hidden>Open in Lens</a>
      <button id="signout" type="button" hidden>Sign out</button>
    </header>
    <main>
      <section id="signin" hidden>
        <p class="hint">Sign in to your Lens to ask its assistant next to any page. Your conversations are the same ones Lens shows.</p>
        <form id="signinForm">
          <label for="server">Lens address</label>
          <input id="server" type="url" placeholder="https://lens.example.com" required autocomplete="url" />
          <div id="tokenRow" hidden>
            <label for="token">API token <span class="hint">this browser can't show Lens's sign-in page: make a write token in Lens, under your account's API tokens</span></label>
            <input id="token" type="password" placeholder="la_…" autocomplete="off" />
          </div>
          <p class="row"><button id="signinButton" class="primary" type="submit">Sign in</button></p>
        </form>
        <p id="signinStatus" class="status" role="status"></p>
      </section>
      <section id="chat" hidden>
        <div id="log" aria-live="polite"></div>
        <form id="ask">
          <textarea id="q" rows="2" placeholder="Ask Lens…" aria-label="Ask Lens"></textarea>
          <button id="send" class="primary" type="submit">Send</button>
        </form>
        <p class="hint keys">Enter sends, Shift+Enter starts a new line, Esc stops the answer.</p>
        <label class="browser" title="While this panel is open, the assistant can open, read and act on pages in this window: only on sites you allow, asking you before anything that sends, deletes, buys or posts">
          <input id="useBrowser" type="checkbox" /> Let Lens use this browser <span id="browserState" class="hint"></span>
        </label>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
