<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ d.title }}</title>
<link rel="stylesheet" href="/static/player.css">
<style>
  html, body { margin: 0; background: #fff; }
  @media (prefers-color-scheme: dark) { html, body { background: #11171D; color: #E4EAF0; } }
  body { padding: 10px 12px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 15px; line-height: 1.3; margin: 0 0 6px; }
  h1 small { font-weight: 400; color: #5B6875; margin-left: 6px; }
  .ap { --ap-h: calc(100vh - 250px); }
</style>
</head>
<body>
<h1>{{ d.title }} <small>{{ d.namespace }}</small></h1>
<div id="player"{% if played %} data-played="{{ played }}"{% endif %}></div>
<script type="application/json" id="player-data">{{ data|safe }}</script>
<script src="/static/player.js"></script>
<script src="/static/embed.js"></script>
</body>
</html>
