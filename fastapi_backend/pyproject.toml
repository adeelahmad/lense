[project]
name = "lens"
version = "0.3.0"
description = "Lens: an archive for recorded speech and video. Transcription, speakers, search, knowledge graph and IIIF, on SurrealDB."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "pydantic-settings>=2.5.2,<3",
    "pyjwt>=2.9,<3",
    "fastapi-mail>=1.4.1,<2",
    "surrealdb>=2.0,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "jinja2>=3.1",
    "pypdf>=4",
    "pillow>=10",
    "cryptography>=42",
]

[project.optional-dependencies]
# Transcription, diarisation and voice IDs. Heavy; install only on machines that run those steps.
sensevoice = ["funasr", "modelscope", "torch", "torchaudio"]
whisper = ["faster-whisper"]
mlx = ["mlx-whisper"]
voices = ["speechbrain", "torch", "torchaudio"]
pyannote = ["pyannote.audio"]
# Video: faces and alternative OCR engines (Tesseract is used through its binary)
faces = ["opencv-python-headless"]
mac-ocr = ["pyobjc-framework-Vision"]
rapidocr = ["rapidocr_onnxruntime"]
insightface = ["insightface", "onnxruntime"]
# Checking IIIF manifests against the official schema
validate = ["jsonschema"]

[project.scripts]
lens = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.4.0,<4",
    "ruff>=0.12,<0.13",
    "watchdog>=5.0.3,<6",
    "python-dotenv>=1.0.1,<2",
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-xdist>=3.6,<4",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mypy>=1.13.0,<2",
    "types-pyyaml",
    "coverage>=7.6",
    "coveralls>=4.0.1,<5",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "commands"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
# The processing engine came from the original prototype and keeps its compact style for now.
"app/domain/**" = ["E", "B", "UP", "I", "BLE001", "E731", "E741"]
"tests/**" = ["B011", "E741"]
"tests/fake_llm.py" = ["E", "B", "UP", "BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
