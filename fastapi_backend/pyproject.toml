[project]
name = "lens"
version = "0.14.0"
description = "Lens: intelligence for your agent. Safe, secure and cost-effective. Turns your live data streams into a cited knowledge graph your agent can reason over."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "fastapi[standard]>=0.143.0,<0.144",
    "starlette>=1.8.0", # security floor (Dependabot); fastapi itself allows older
    "pydantic-settings>=2.5.2,<3",
    "pyjwt>=2.9,<3",
    "fastapi-mail>=1.4.1,<2",
    "surrealdb>=2.0,<3",
    "numpy>=2.5.4",
    "scipy>=1.11",
    "pyyaml>=6",
    "jinja2>=3.1",
    "pypdf>=6.20.1",
    "pillow>=10",
    "markdown>=3.11.1",
    "cryptography>=50",
    "rdflib>=7.1,<8",  # the archive as RDF (Dublin Core): export, import, SPARQL
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "webauthn>=3.0.1,<4",
    "feedparser>=6.0.11,<7",
    "regex>=2024.11",  # patterns in automations' conditions, with a time limit (Apache-2.0; fastapi-mail needs it too)
]

[project.optional-dependencies]
# Transcription, diarisation and voice IDs. Heavy; install only on machines that run those steps.
sensevoice = ["funasr", "modelscope", "torch", "torchaudio"]
whisper = ["faster-whisper"]
mlx = ["mlx-whisper"]
# Laya typed decision models on MLX (Apple Silicon only): a local decision engine beside Jev
laya = ["laya-mlx>=0.4.0"]
voices = ["speechbrain", "torch", "torchaudio"]
pyannote = ["pyannote.audio"]
# Video: faces and alternative OCR engines (Tesseract is used through its binary)
faces = ["opencv-python-headless"]
mac-ocr = ["pyobjc-framework-Vision; sys_platform == 'darwin'"]  # Apple Vision; a no-op elsewhere
rapidocr = ["rapidocr_onnxruntime"]
doctr = ["python-doctr>=1.0"]  # docTR (Apache-2.0) on PyTorch: several GB
insightface = ["insightface", "onnxruntime"]
# Objects: YOLOX on ONNX Runtime (Apache-2.0; the model is a YOLOX .onnx file). Ultralytics YOLO also works if
# installed by hand (pip install ultralytics): it's AGPL-3.0, so it isn't an extra here.
objects = ["onnxruntime"]
# Punctuation put back in transcripts (analysis.cleanup_punctuation): kredor/punctuate-all on Transformers and PyTorch
punctuation = ["transformers", "torch"]
# Named entities found by spaCy (analysis.entities "spacy"); its MIT-licensed models are fetched as pinned wheels
spacy = ["spacy>=3.8,<3.9"]
# A local prompt-injection classifier (ai.injection_check "classifier"): ProtectAI's DeBERTa model on ONNX Runtime
injection = ["onnxruntime", "tokenizers"]
# Florence-2 (MIT) describing pictures on this machine (llm.describe_engine "florence-2"): its ONNX export on ONNX Runtime
florence = ["onnxruntime", "tokenizers"]
# Moondream describing pictures on this machine (llm.describe_engine "moondream"): its own code on transformers and
# PyTorch. Moondream 3 Preview's weights are BSL 1.1 (not open source), Moondream 2's Apache-2.0; fetched only when picked
moondream = ["torch", "transformers"]
# Checking IIIF manifests against the official schema
validate = ["jsonschema"]
# the SMB share of the file tree (smb_share.py): impacket's SMB server (a modified Apache 1.1 license); fetched when
# Settings › SMB share is turned on
smb = ["impacket>=0.13"]
# the assistant's code sandbox (sandbox.py): NVIDIA OpenShell's client (Apache-2.0), to reach its gateway; fetched when
# Settings › Code sandbox is turned on
sandbox = ["openshell>=0.1.4,<0.2"]
# the assistant's web search through DuckDuckGo (web.py): ddgs (MIT), with its Rust HTTP client (primp) and lxml;
# fetched when DuckDuckGo is picked in Settings › AI assistant › Web search
web = ["ddgs>=9.16,<10"]
# Outlook .msg emails (extract-msg is GPL-3.0; .eml needs nothing)
msg = ["extract-msg"]
# secrets read from a Vaultwarden or Bitwarden vault (vaultwarden_secrets.py): python-vaultwarden (Apache-2.0); fetched
# when Settings › Secrets has a Vaultwarden address
vaultwarden = ["python-vaultwarden>=1.1.2,<2"]

[project.scripts]
lens = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.0,<0.18",
    "watchdog>=6.0.0,<7",
    "python-dotenv>=1.2.4,<2",
    "pytest>=9.0.3,<10",
    "pytest-mock>=3.14.0,<4",
    "pytest-xdist>=3.6,<4",
    "pytest-cov>=5,<8",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mypy>=2.4.0,<3",
    "types-pyyaml",
    "coverage>=7.6",
    "coveralls>=4.0.1,<5",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.7.7",
    "onnxruntime>=1.31.0",  # the objects tests run a small YOLOX-shaped model
    "onnx>=1.23.2",  # ... which they build
    "tokenizers>=0.23.3",  # the injection classifier tests run a tiny model and tokenizer
    "mcp>=2.3.0",  # the official MCP client, to test the MCP server with
    "impacket>=0.13",  # the SMB share's server, and the SMB client its tests sign in with
    "openshell>=0.1.4,<0.2",  # the code sandbox's client, tested against a fake OpenShell gateway
    "botocore>=1.43.113",
    "python-vaultwarden>=1.1.2,<2",  # the Vaultwarden client, tested against a fake Vaultwarden
]

[tool.hatch.build.targets.wheel]
packages = ["app", "commands"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
# The processing engine came from the original prototype and keeps its compact style for now.
"app/domain/**" = ["E", "B", "UP", "I", "BLE001", "E731", "E741"]
"tests/**" = ["B011", "E741"]
"tests/fake_llm.py" = ["E", "B", "UP", "BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
