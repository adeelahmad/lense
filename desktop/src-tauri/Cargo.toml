[package]
name = "lens-desktop"
version = "0.7.0"
description = "Lens for macOS: installs, starts and opens Lens from the menu bar"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
