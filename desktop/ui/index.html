<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6e6e73; --err: #c5221f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --err: #f28b82; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 22px; font-weight: 600; margin: 16px 0 6px; }
  #status { color: var(--muted); margin: 0; max-width: 32em; }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <img src="lens.svg" alt="">
  <h1>Lens</h1>
  <p id="status">Getting Lens ready…</p>
</main>
<script>
  // the app sets what's happening (src-tauri/src/main.rs)
  window.setStatus = (text, error) => {
    const p = document.getElementById("status");
    p.textContent = text;
    p.className = error ? "err" : "";
  };
</script>
</body>
</html>
